<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fisioterapeuta — PerFisio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    body { background: var(--bg); }
    .lp-header {
      display: flex; align-items: center; gap: 12px; padding: 16px 6vw;
      border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(255,255,255,.94);
      backdrop-filter: blur(8px); z-index: 50;
    }
    .lp-header .logo { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.1rem; color: var(--ink); }
    .lp-header .logo .mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; display: grid; place-items: center; font-size: .95rem; }
    .lp-header nav { margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: .88rem; font-weight: 600; color: var(--text-soft); }

    .pf-wrap { max-width: 980px; margin: 0 auto; padding: 26px 5vw 70px; }
    .pf-banner { height: 150px; border-radius: 18px 18px 0 0; position: relative; }
    .pf-card { background: #fff; border: 1px solid var(--line); border-radius: 0 0 18px 18px; padding: 0 30px 26px; box-shadow: var(--shadow); }
    .pf-avatar {
      width: 96px; height: 96px; border-radius: 50%; border: 4px solid #fff; margin-top: -48px;
      display: grid; place-items: center; font-weight: 900; font-size: 1.7rem; color: #fff; box-shadow: var(--shadow);
    }
    .pf-nome { font-size: 1.6rem; font-weight: 900; color: var(--ink); letter-spacing: -.5px; margin-top: 12px; }
    .pf-sub { font-size: .92rem; color: var(--text-soft); margin-top: 3px; }
    .pf-sub a { color: var(--primary-dark); font-weight: 700; }
    .pf-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: .84rem; color: var(--text-soft); }
    .pf-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; }
    .pf-cta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 20px; padding-top: 18px; border-top: 1px solid #EDF1F0; }
    .pf-preco { font-size: 1.15rem; font-weight: 900; color: var(--ink); margin-right: auto; }

    .pf-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin-top: 20px; align-items: start; }
    .pf-sec { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; box-shadow: var(--shadow); }
    .pf-sec h2 { font-size: 1rem; font-weight: 800; color: var(--ink); margin-bottom: 10px; }
    .pf-sec p { font-size: .9rem; color: var(--text); line-height: 1.7; }
    .info-li { display: flex; gap: 10px; padding: 8px 0; font-size: .86rem; border-bottom: 1px solid #F0F4F3; }
    .info-li:last-child { border-bottom: none; }
    .info-li b { color: var(--ink); }
    #mapaFisio { height: 260px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); margin-top: 12px; display: none; }

    .colegas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 12px; }
    .colega { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: #fff; display: flex; gap: 12px; align-items: center; transition: all .15s; }
    .colega:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow); }
    .colega .av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; flex-shrink: 0; }
    .colega .n { font-size: .88rem; font-weight: 700; color: var(--ink); }
    .colega .s { font-size: .72rem; color: var(--text-soft); }
    @media (max-width: 860px) { .pf-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="lp-header">
    <a class="logo" href="index.html"><span class="mark">P</span> PerFisio</a>
    <nav>
      <a href="index.html#profissionais">← Voltar ao diretório</a>
      <a href="login.html" class="btn btn-ghost btn-sm">Entrar</a>
    </nav>
  </header>

  <div class="pf-wrap" id="conteudo">
    <div style="text-align:center;color:var(--text-soft);padding:60px 0;">Carregando perfil...</div>
  </div>

  <!-- MODAL SOLICITAR AVALIAÇÃO -->
  <div class="modal-overlay" id="mAvaliacao">
    <div class="modal">
      <div class="modal-head">
        <h3 id="avTitulo">Solicitar avaliação</h3>
        <button class="close" onclick="App.closeModal('mAvaliacao')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field"><label>Seu nome *</label><input type="text" id="avNome"></div>
          <div class="field"><label>Telefone / WhatsApp</label><input type="text" id="avTel"></div>
          <div class="field full"><label>O que você está sentindo?</label><textarea id="avObs" placeholder="Ex.: dor no joelho ao subir escadas há 2 meses"></textarea></div>
        </div>
        <div style="margin-top:10px;font-size:.78rem;color:var(--text-soft);">O profissional recebe seu contato e retorna para agendar a avaliação.</div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="App.closeModal('mAvaliacao')">Cancelar</button>
        <button class="btn btn-primary" id="btnAv" onclick="enviarSolicitacao()">Enviar solicitação</button>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    const LABEL = {
      esportiva: '🏃 Esportiva', ortopedia: '🦴 Ortopedia', pilates: '🧘 Pilates', neuro: '🧠 Neuro',
      rpg: '🧍 RPG', respiratoria: '🫁 Respiratória', pelvica: '🌸 Pélvica', geriatrica: '👵 Geriátrica',
    };
    const fisioId = new URLSearchParams(location.search).get('id');
    let PRO = null;

    const escurecer = hex => {
      const n = parseInt(hex.slice(1), 16);
      const f = c => Math.max(0, Math.round(c * 0.72)).toString(16).padStart(2, '0');
      return '#' + f(n >> 16 & 255) + f(n >> 8 & 255) + f(n & 255);
    };

    async function boot() {
      if (!fisioId) { location.href = 'index.html'; return; }
      try { PRO = await PF.api('/api/public/profissionais/' + fisioId); }
      catch (e) {
        document.getElementById('conteudo').innerHTML =
          `<div style="text-align:center;padding:60px 0;color:var(--text-soft);">Perfil não encontrado ou não está mais público.<br><br><a class="btn btn-primary" href="index.html#profissionais">← Voltar ao diretório</a></div>`;
        return;
      }
      document.title = `${PRO.nome} · Fisioterapeuta — PerFisio`;
      const p = PRO;
      const cor2 = escurecer(p.cor);
      const ini = p.nome.split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase();
      document.getElementById('conteudo').innerHTML = `
        <div class="pf-banner" style="background:linear-gradient(135deg,${p.cor},${cor2});"></div>
        <div class="pf-card">
          <div class="pf-avatar" style="background:${cor2};">${ini}</div>
          <div class="pf-nome">${p.nome}</div>
          <div class="pf-sub">${p.esp || 'Fisioterapeuta'} · <a href="clinica.html?id=${p.clinica_id}">${p.clinica_nome}</a></div>
          <div class="pf-meta">
            ${p.crefito ? `<span>✅ ${p.crefito}</span>` : ''}
            ${p.bairro ? `<span>📍 ${p.bairro}${p.cidade ? ', ' + p.cidade : ''}</span>` : ''}
            ${p.domiciliar ? '<span>🏠 Atende em domicílio</span>' : ''}
          </div>
          <div class="pf-chips">${p.especialidades.map(e => `<span class="badge primary">${LABEL[e] || e}</span>`).join('')}</div>
          <div class="pf-cta">
            <span class="pf-preco">${p.preco || ''}</span>
            <button class="btn btn-primary" style="padding:12px 26px;" onclick="App.openModal('mAvaliacao')">Agendar avaliação</button>
          </div>
        </div>

        <div class="pf-grid">
          <div>
            <div class="pf-sec">
              <h2>Sobre</h2>
              <p>${p.bio ? p.bio.replace(/\n/g, '<br>') : 'Este profissional ainda não escreveu a apresentação.'}</p>
            </div>
            ${p.colegas.length ? `
            <div class="pf-sec" style="margin-top:20px;">
              <h2>Também na ${p.clinica_nome}</h2>
              <div class="colegas">
                ${p.colegas.map(c => `
                  <a class="colega" href="fisio.html?id=${c.id}">
                    <span class="av" style="background:${c.cor};">${c.nome.split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase()}</span>
                    <span><span class="n">${c.nome}</span><br><span class="s">${c.esp || (c.especialidades.map(e => (LABEL[e] || e).split(' ')[1]).join(' · '))}</span></span>
                  </a>`).join('')}
              </div>
            </div>` : ''}
          </div>
          <div>
            <div class="pf-sec">
              <h2>Onde atende</h2>
              <div class="info-li"><span>🏥</span><span><b>${p.clinica_nome}</b>${p.clinica_endereco ? '<br>' + p.clinica_endereco : ''}</span></div>
              ${p.clinica_horario ? `<div class="info-li"><span>🕐</span><span>${p.clinica_horario}</span></div>` : ''}
              ${p.clinica_telefone ? `<div class="info-li"><span>📞</span><span>${p.clinica_telefone}</span></div>` : ''}
              ${p.domiciliar ? `<div class="info-li"><span>🏠</span><span>Atendimento domiciliar na região${p.bairro ? ' de ' + p.bairro : ''}</span></div>` : ''}
              <div id="mapaFisio"></div>
              <a class="link" href="clinica.html?id=${p.clinica_id}" style="display:inline-block;margin-top:12px;font-size:.84rem;font-weight:700;color:var(--primary);">Ver página da clínica →</a>
            </div>
          </div>
        </div>`;
      document.getElementById('avTitulo').textContent = 'Solicitar avaliação — ' + p.nome;
      iniciarMapa();
    }

    async function iniciarMapa() {
      if (PRO.lat == null) return;
      let token = null;
      try { token = (await PF.api('/api/public/config')).mapbox; } catch (e) {}
      if (!token) return;
      await new Promise(res => {
        const css = document.createElement('link');
        css.rel = 'stylesheet'; css.href = 'https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css';
        document.head.appendChild(css);
        const s = document.createElement('script');
        s.src = 'https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js';
        s.onload = res; s.onerror = res;
        document.head.appendChild(s);
      });
      if (!window.mapboxgl) return;
      const el = document.getElementById('mapaFisio');
      el.style.display = 'block';
      mapboxgl.accessToken = token;
      const m = new mapboxgl.Map({ container: el, style: 'mapbox://styles/mapbox/light-v11', center: [PRO.lng, PRO.lat], zoom: 14 });
      new mapboxgl.Marker({ color: '#0DA189' }).setLngLat([PRO.lng, PRO.lat]).addTo(m);
    }

    async function enviarSolicitacao() {
      if (!avNome.value.trim()) { App.toast('Informe seu nome', 'error'); return; }
      const btn = document.getElementById('btnAv'); btn.disabled = true;
      try {
        await PF.api('/api/public/leads-profissional', { method: 'POST', body: {
          fisio_id: fisioId, nome: avNome.value.trim(), telefone: avTel.value.trim() || null, obs: avObs.value.trim() || null,
        }});
        App.closeModal('mAvaliacao');
        App.toast('Solicitação enviada! ' + PRO.nome.split(' ')[0] + ' entrará em contato. ✅');
        avNome.value = ''; avTel.value = ''; avObs.value = '';
      } catch (e) { App.toast(e.message, 'error'); }
      btn.disabled = false;
    }

    boot();
  </script>
</body>
</html>
