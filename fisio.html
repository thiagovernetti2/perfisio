<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fisioterapeuta — PerFisio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    body { background: var(--bg); }
    .lp-header {
      display: flex; align-items: center; gap: 12px; padding: 16px 6vw;
      border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(255,255,255,.94);
      backdrop-filter: blur(8px); z-index: 50;
    }
    .lp-header .logo { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.1rem; color: var(--ink); }
    .lp-header .logo .mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; display: grid; place-items: center; font-size: .95rem; }
    .lp-header nav { margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: .88rem; font-weight: 600; color: var(--text-soft); }

    .pf-wrap { max-width: 880px; margin: 0 auto; padding: 26px 5vw 90px; }
    .pf-banner { height: 140px; border-radius: 18px 18px 0 0; }
    .pf-card { background: #fff; border: 1px solid var(--line); border-radius: 0 0 18px 18px; padding: 0 30px 24px; box-shadow: var(--shadow); }
    .pf-avatar {
      width: 96px; height: 96px; border-radius: 50%; border: 4px solid #fff; margin-top: -48px;
      display: grid; place-items: center; font-weight: 900; font-size: 1.7rem; color: #fff; box-shadow: var(--shadow);
      position: relative; overflow: hidden;
    }
    .pf-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .galeria img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; transition: transform .12s; }
    .galeria img:hover { transform: scale(1.02); }
    .lightbox { position: fixed; inset: 0; background: rgba(10,20,22,.88); z-index: 100; display: none; align-items: center; justify-content: center; padding: 4vh 4vw; cursor: zoom-out; }
    .lightbox.aberta { display: flex; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; }
    .pf-nome { font-size: 1.55rem; font-weight: 900; color: var(--ink); letter-spacing: -.5px; margin-top: 12px; }
    .pf-sub { font-size: .95rem; color: var(--text-soft); margin-top: 3px; }
    .pf-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .pf-cta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 18px; padding-top: 16px; border-top: 1px solid #EDF1F0; }
    .pf-preco { font-size: 1.1rem; font-weight: 900; color: var(--ink); margin-right: auto; }
    .btn-wpp { background: #22B461; color: #fff; }
    .btn-wpp:hover { background: #1B9A52; }

    .pf-sec { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 22px 26px; box-shadow: var(--shadow); margin-top: 18px; }
    .pf-sec h2 { font-size: 1.02rem; font-weight: 800; color: var(--ink); margin-bottom: 12px; }
    .pf-sec p { font-size: .9rem; color: var(--text); line-height: 1.7; }
    .sobre-txt.fechado { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .ler-mais { color: var(--primary-dark); font-weight: 700; font-size: .84rem; cursor: pointer; margin-top: 6px; display: inline-block; }

    .trat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .trat-card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .trat-card b { font-size: .9rem; color: var(--ink); }
    .trat-card .btn { align-self: flex-start; }

    .pac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .pac-card { border: 1.5px solid var(--line); border-radius: 14px; padding: 18px; text-align: center; }
    .pac-card.destaque { border-color: var(--primary); background: var(--primary-soft); }
    .pac-card .pn { font-size: .86rem; font-weight: 700; color: var(--ink); }
    .pac-card .pv { font-size: 1.35rem; font-weight: 900; color: var(--ink); margin: 8px 0 2px; }
    .pac-card .pd { font-size: .72rem; color: var(--text-soft); }

    .aval-wrap { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
    .aval-circ { width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
      background: conic-gradient(var(--line) 0 100%); position: relative; }
    .aval-circ::before { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: #fff; }
    .aval-circ span { position: relative; font-weight: 900; font-size: 1rem; color: var(--text-soft); text-align: center; line-height: 1.2; }
    .aval-bars { flex: 1; min-width: 220px; }
    .aval-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; font-size: .8rem; color: var(--text-soft); }
    .aval-bar .lb { width: 84px; font-weight: 600; }
    .aval-bar .tr { flex: 1; height: 8px; background: #E9EFED; border-radius: 99px; overflow: hidden; }
    .aval-bar .fl { height: 100%; background: var(--primary); border-radius: 99px; }

    .info-li { display: flex; gap: 10px; padding: 8px 0; font-size: .86rem; border-bottom: 1px solid #F0F4F3; }
    .info-li:last-child { border-bottom: none; }
    .info-li b { color: var(--ink); }
    #mapaFisio { height: 240px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); margin-top: 12px; display: none; }

    .clin-card { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .clin-av { width: 62px; height: 62px; border-radius: 16px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 1.2rem; flex-shrink: 0; }

    .colegas { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
    .colega { border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; background: #fff; display: flex; gap: 11px; align-items: center; transition: all .15s; }
    .colega:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow); }
    .colega .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; flex-shrink: 0; position: relative; overflow: hidden; }
    .colega .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .colega .n { font-size: .86rem; font-weight: 700; color: var(--ink); }
    .colega .s { font-size: .7rem; color: var(--text-soft); }

    .cta-fixa { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line);
      padding: 10px 5vw; display: none; gap: 10px; z-index: 60; }
    .cta-fixa .btn { flex: 1; justify-content: center; }
    @media (max-width: 720px) { .cta-fixa { display: flex; } }

    /* ===== Componente de agendamento ===== */
    .bk-aviso { background: var(--primary-soft); border: 1.5px dashed var(--primary); border-radius: 10px; padding: 10px 14px; font-size: .84rem; color: var(--primary-dark); font-weight: 600; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .bk-dias { display: flex; gap: 8px; align-items: stretch; margin-bottom: 14px; }
    .bk-dias .nav { border: 1px solid var(--line); background: #fff; border-radius: 10px; width: 36px; font-size: 1rem; cursor: pointer; color: var(--text-soft); }
    .bk-dias .nav:hover { border-color: var(--primary); color: var(--primary-dark); }
    .bk-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; flex: 1; }
    .bk-dia { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 2px; text-align: center; cursor: pointer; background: #fff; transition: all .12s; }
    .bk-dia .dw { font-size: .62rem; font-weight: 700; text-transform: uppercase; color: var(--text-soft); letter-spacing: .5px; }
    .bk-dia .dn { font-size: 1.05rem; font-weight: 800; color: var(--ink); }
    .bk-dia .dm { font-size: .6rem; color: var(--text-soft); }
    .bk-dia:hover { border-color: var(--primary); }
    .bk-dia.sel { border-color: var(--primary); background: var(--primary-soft); }
    .bk-dia.sel .dn { color: var(--primary-dark); }
    .bk-dia.off { opacity: .38; pointer-events: none; }
    .bk-dia.hoje .dw { color: var(--primary-dark); }
    .bk-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
    .bk-slot { border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 4px; text-align: center; font-size: .84rem; font-weight: 700; color: var(--ink); cursor: pointer; background: #fff; transition: all .12s; }
    .bk-slot:hover { border-color: var(--primary); color: var(--primary-dark); }
    .bk-slot.sel { background: var(--primary); border-color: var(--primary); color: #fff; }
    .bk-slot.ocupado { opacity: .35; text-decoration: line-through; pointer-events: none; background: var(--bg); }
    .bk-rec { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .bk-rec .chip.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-dark); }
    .bk-preview { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
    .bk-preview span { font-size: .74rem; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--green-soft); color: var(--green); }
    .bk-preview span.conf { background: var(--red-soft); color: var(--red); text-decoration: line-through; }
    .bk-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .bk-form .full { grid-column: 1 / -1; }
    .bk-ok { text-align: center; padding: 18px 10px; }
    .bk-ok .cod { font-size: 1.7rem; font-weight: 900; letter-spacing: 2px; color: var(--primary-dark); background: var(--primary-soft); border-radius: 12px; padding: 12px 22px; display: inline-block; margin: 12px 0; }
    .bk-sessao { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; cursor: pointer; }
    .bk-sessao.sel { border-color: var(--primary); background: var(--primary-soft); }
    @media (max-width: 640px) { .bk-form { grid-template-columns: 1fr; } .bk-strip { grid-template-columns: repeat(4, 1fr); } .bk-strip .bk-dia:nth-child(n+5) { display: none; } }
  </style>
</head>
<body>

  <header class="lp-header">
    <a class="logo" href="index.html"><span class="mark">P</span> PerFisio</a>
    <nav>
      <a href="index.html#profissionais">← Voltar ao diretório</a>
      <a href="login.html" class="btn btn-ghost btn-sm">Entrar</a>
    </nav>
  </header>

  <div class="pf-wrap" id="conteudo">
    <div style="text-align:center;color:var(--text-soft);padding:60px 0;">Carregando perfil...</div>
  </div>

  <div class="cta-fixa" id="ctaFixa"></div>

  <div class="lightbox" id="lightbox" onclick="this.classList.remove('aberta')"><img id="lightboxImg" alt=""></div>

  <!-- MODAL SOLICITAR AVALIAÇÃO -->
  <div class="modal-overlay" id="mAvaliacao">
    <div class="modal">
      <div class="modal-head">
        <h3 id="avTitulo">Solicitar avaliação</h3>
        <button class="close" onclick="App.closeModal('mAvaliacao')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field"><label>Seu nome *</label><input type="text" id="avNome"></div>
          <div class="field"><label>Telefone / WhatsApp</label><input type="text" id="avTel"></div>
          <div class="field full"><label>O que você está sentindo?</label><textarea id="avObs" placeholder="Ex.: dor no joelho ao subir escadas há 2 meses"></textarea></div>
        </div>
        <div style="margin-top:10px;font-size:.78rem;color:var(--text-soft);">O profissional recebe seu contato e retorna para agendar a avaliação.</div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="App.closeModal('mAvaliacao')">Cancelar</button>
        <button class="btn btn-primary" id="btnAv" onclick="enviarSolicitacao()">Enviar solicitação</button>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    const LABEL = {
      esportiva: '🏃 Esportiva', ortopedia: '🦴 Ortopedia', pilates: '🧘 Pilates', neuro: '🧠 Neuro',
      rpg: '🧍 RPG', respiratoria: '🫁 Respiratória', pelvica: '🌸 Pélvica', geriatrica: '👵 Geriátrica',
    };
    const NOME_ESP = { esportiva: 'Esportiva', ortopedia: 'Ortopedia', pilates: 'Pilates', neuro: 'Neuro', rpg: 'RPG', respiratoria: 'Respiratória', pelvica: 'Pélvica', geriatrica: 'Geriátrica' };
    const TRAT_PADRAO = ['Articulares', 'Lesões do esporte', 'Musculares', 'Reabilitação funcional', 'Dores em geral'];
    const fisioId = new URLSearchParams(location.search).get('id');
    let PRO = null;

    const escurecer = hex => {
      const n = parseInt(hex.slice(1), 16);
      const f = c => Math.max(0, Math.round(c * 0.72)).toString(16).padStart(2, '0');
      return '#' + f(n >> 16 & 255) + f(n >> 8 & 255) + f(n & 255);
    };
    const soDigitos = s => (s || '').replace(/\D/g, '');
    const wpp = (num, msg) => `https://wa.me/55${soDigitos(num)}?text=${encodeURIComponent(msg)}`;

    async function boot() {
      if (!fisioId) { location.href = 'index.html'; return; }
      try { PRO = await PF.api('/api/public/profissionais/' + fisioId); }
      catch (e) {
        document.getElementById('conteudo').innerHTML =
          `<div style="text-align:center;padding:60px 0;color:var(--text-soft);">Perfil não encontrado ou não está mais público.<br><br><a class="btn btn-primary" href="index.html#profissionais">← Voltar ao diretório</a></div>`;
        return;
      }
      const p = PRO;
      document.title = `${p.nome} · Fisioterapia em ${p.cidade || p.bairro || 'sua região'} — PerFisio`;
      const cor2 = escurecer(p.cor);
      const ini = p.nome.split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase();
      const espNomes = p.especialidades.map(e => NOME_ESP[e] || e);
      const subtitulo = `Fisioterapia${espNomes.length ? ', ' + espNomes.join(', ') : ''}${p.cidade ? ' em ' + p.cidade.split('/')[0] : ''}`;
      const numWpp = p.whatsapp || p.clinica_telefone;
      const msgPadrao = `Olá! Vi o perfil de ${p.nome} no PerFisio e gostaria de agendar uma avaliação.`;
      const trats = p.tratamentos.length ? p.tratamentos : TRAT_PADRAO;
      const TIPO_PAC = { avulsa: 'Consulta individual', pacote: 'Pacote', mensal: 'Plano mensal' };

      document.getElementById('conteudo').innerHTML = `
        <!-- HERO -->
        <div class="pf-banner" style="background:linear-gradient(135deg,${p.cor},${cor2});"></div>
        <div class="pf-card">
          <div class="pf-avatar" style="background:${cor2};">${ini}${p.tem_foto ? `<img src="/api/public/fisio-foto/${p.id}" alt="${p.nome}" onerror="this.remove()">` : ''}</div>
          <div class="pf-nome">${p.nome}</div>
          <div class="pf-sub">${subtitulo}</div>
          <div class="pf-badges">
            ${p.crefito ? `<span class="badge green">✅ ${p.crefito}</span>` : ''}
            ${p.domiciliar ? '<span class="badge amber">🏠 Atendimento domiciliar</span>' : ''}
            ${p.clinica_nome ? `<span class="badge blue">🏥 Clínica parceira</span>` : ''}
            <span class="badge primary">✨ Novo no PerFisio</span>
          </div>
          <div class="pf-cta">
            <span class="pf-preco">${p.preco || ''}</span>
            ${numWpp ? `<a class="btn btn-wpp" href="${wpp(numWpp, msgPadrao)}" target="_blank" rel="noopener">💬 WhatsApp</a>` : ''}
            <button class="btn btn-primary" style="padding:12px 24px;" onclick="irAgenda()">Agendar horário</button>
          </div>
        </div>

        <!-- AGENDAMENTO ONLINE -->
        <div class="pf-sec" id="secAgenda">
          <h2>📅 Agende seu horário</h2>
          <div id="bkComponente"></div>
          <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:.8rem;">
            <span class="ler-mais" onclick="abrirRemarcar()">Já agendou? Remarcar ou cancelar →</span>
            <span class="ler-mais" style="color:var(--text-soft);" onclick="App.openModal('mAvaliacao')">Prefere que a clínica entre em contato?</span>
          </div>
        </div>

        <!-- SOBRE -->
        <div class="pf-sec">
          <h2>Sobre</h2>
          <p class="sobre-txt fechado" id="sobreTxt">${p.bio ? p.bio.replace(/\n/g, '<br>') : 'Este profissional ainda não escreveu a apresentação.'}</p>
          ${p.bio && p.bio.length > 180 ? '<span class="ler-mais" id="lerMais" onclick="toggleSobre()">Ler mais</span>' : ''}
        </div>

        <!-- TRATAMENTOS -->
        <div class="pf-sec">
          <h2>Tratamentos</h2>
          <div class="trat-grid">
            ${trats.map(t => `<div class="trat-card">
              <b>${t}</b>
              ${numWpp ? `<a class="btn btn-soft btn-sm" href="${wpp(numWpp, `Olá! Vi no PerFisio que ${p.nome} trata "${t}" e gostaria de mais informações.`)}" target="_blank" rel="noopener">💬 Mensagem</a>`
                : `<button class="btn btn-soft btn-sm" onclick="App.openModal('mAvaliacao')">Mensagem</button>`}
            </div>`).join('')}
          </div>
        </div>

        <!-- PACOTES DE ATENDIMENTO -->
        ${p.pacotes.length ? `<div class="pf-sec">
          <h2>Pacotes de atendimento</h2>
          <div class="pac-grid">
            ${p.pacotes.map((pc, i) => `<div class="pac-card${i === 1 ? ' destaque' : ''}">
              <div class="pn">${TIPO_PAC[pc.tipo] === 'Pacote' ? pc.nome : (TIPO_PAC[pc.tipo] || pc.nome)}</div>
              <div class="pv">${pc.valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 })}${pc.tipo === 'mensal' ? '<span style="font-size:.75rem;font-weight:600;color:var(--text-soft);">/mês</span>' : ''}</div>
              <div class="pd">${pc.sessoes > 1 ? pc.sessoes + ' sessões' : '1 sessão'}${pc.descricao ? ' · ' + pc.descricao : ''}</div>
            </div>`).join('')}
          </div>
          <div style="text-align:center;margin-top:16px;">
            <button class="btn btn-primary" onclick="irAgenda()">Agendar avaliação</button>
          </div>
        </div>` : ''}

        <!-- AVALIAÇÕES -->
        <div class="pf-sec">
          <h2>Avaliações de pacientes</h2>
          <div class="aval-wrap">
            <div class="aval-circ"><span>Sem<br>avaliações</span></div>
            <div class="aval-bars">
              ${['Excelente', 'Muito bom', 'Bom', 'Regular'].map(l =>
                `<div class="aval-bar"><span class="lb">${l}</span><span class="tr"><span class="fl" style="width:0%;"></span></span><span>0%</span></div>`).join('')}
              <div style="font-size:.78rem;color:var(--text-soft);margin-top:6px;">Este perfil ainda não recebeu avaliações públicas. Foi atendido por ${p.nome.split(' ')[0]}? Envie a sua pelo WhatsApp.</div>
            </div>
          </div>
        </div>

        <!-- FOTOS -->
        ${p.galeria.length ? `<div class="pf-sec">
          <h2>Fotos</h2>
          <div class="galeria">
            ${p.galeria.map(g => `<img src="/api/public/galeria-foto/${g.id}" alt="${g.nome || 'Foto'}" loading="lazy" onclick="abrirFoto('/api/public/galeria-foto/${g.id}')">`).join('')}
          </div>
        </div>` : ''}

        <!-- ATENDIMENTO -->
        <div class="pf-sec">
          <h2>Atendimento</h2>
          <div style="display:flex;gap:7px;flex-wrap:wrap;">
            ${p.especialidades.map(e => `<span class="badge primary">${LABEL[e] || e}</span>`).join('')}
            ${p.domiciliar ? '<span class="badge amber">🏠 Domiciliar</span>' : ''}
            <span class="badge gray">🏥 Na clínica</span>
          </div>
          ${p.clinica_horario ? `<p style="margin-top:12px;font-size:.84rem;">🕐 ${p.clinica_horario}</p>` : ''}
        </div>

        <!-- REGIÕES ATENDIDAS -->
        <div class="pf-sec">
          <h2>Regiões atendidas</h2>
          <p>📍 ${p.regioes || [p.bairro, p.cidade].filter(Boolean).join(', ') || 'Consulte pelo WhatsApp'}</p>
          <div id="mapaFisio"></div>
        </div>

        <!-- CLÍNICA ASSOCIADA -->
        <div class="pf-sec">
          <h2>Clínica associada</h2>
          <div class="clin-card">
            <div class="clin-av">${p.clinica_nome.split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase()}</div>
            <div style="flex:1;min-width:200px;">
              <div style="font-weight:800;color:var(--ink);">${p.clinica_nome}</div>
              <div style="font-size:.8rem;color:var(--text-soft);margin-top:2px;">${p.clinica_endereco || ''}</div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <a class="btn btn-ghost btn-sm" href="clinica.html?id=${p.clinica_id}">Ver clínica</a>
              ${p.clinica_telefone ? `<a class="btn btn-soft btn-sm" href="${wpp(p.clinica_telefone, 'Olá! Vim pelo PerFisio e gostaria de informações sobre a ' + p.clinica_nome + '.')}" target="_blank" rel="noopener">💬 Enviar mensagem</a>` : ''}
            </div>
          </div>
        </div>

        <!-- REDES SOCIAIS E PLANOS -->
        <div class="pf-sec">
          <h2>Redes sociais e planos</h2>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
            ${p.instagram ? `<a class="btn btn-ghost btn-sm" href="https://instagram.com/${p.instagram.replace('@', '')}" target="_blank" rel="noopener">📸 @${p.instagram.replace('@', '')}</a>` : ''}
            ${numWpp ? `<a class="btn btn-soft btn-sm" href="${wpp(numWpp, `Olá! Gostaria de saber se ${p.nome} atende pelo meu plano de saúde.`)}" target="_blank" rel="noopener">🏥 Atende meu plano? Perguntar</a>` : ''}
          </div>
        </div>

        ${p.colegas.length ? `<div class="pf-sec">
          <h2>Também na ${p.clinica_nome}</h2>
          <div class="colegas">
            ${p.colegas.map(c => `
              <a class="colega" href="fisio.html?id=${c.id}">
                <span class="av" style="background:${c.cor};">${c.nome.split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase()}${c.tem_foto ? `<img src="/api/public/fisio-foto/${c.id}" alt="" loading="lazy" onerror="this.remove()">` : ''}</span>
                <span><span class="n">${c.nome}</span><br><span class="s">${c.esp || ''}</span></span>
              </a>`).join('')}
          </div>
        </div>` : ''}`;

      document.getElementById('avTitulo').textContent = 'Solicitar avaliação — ' + p.nome;
      document.getElementById('ctaFixa').innerHTML = `
        ${numWpp ? `<a class="btn btn-wpp" href="${wpp(numWpp, msgPadrao)}" target="_blank" rel="noopener">💬 WhatsApp</a>` : ''}
        <button class="btn btn-primary" onclick="irAgenda()">Agendar horário</button>`;
      iniciarMapa();
      bkInit();
    }

    function abrirFoto(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('aberta');
    }

    function irAgenda() {
      document.getElementById('secAgenda').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    /* link "Agendar" vindo da página da clínica cai direto no calendário */
    if (location.hash === '#agendar') setTimeout(irAgenda, 700);

    /* ================= COMPONENTE DE AGENDAMENTO ================= */
    const HORAS = ['07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00'];
    const DWS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const MES3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    let bkOcupados = new Set();      // 'YYYY-MM-DD|HH:MM'
    let bkInicio = 0;                // deslocamento da janela de 7 dias
    let bkData = null, bkHora = null, bkSemanas = 1;
    let bkModo = 'novo';             // 'novo' | 'remarcar'
    let bkReserva = null;            // { codigo, sessoes, sessaoSel }

    const isoDia = off => { const d = new Date(); d.setDate(d.getDate() + off); return d.toISOString().slice(0, 10); };
    const fmtBR = iso => `${iso.slice(8,10)}/${iso.slice(5,7)}`;

    async function bkCarregarOcupados() {
      try {
        const r = await PF.api(`/api/public/agenda/${fisioId}?from=${isoDia(0)}&to=${isoDia(90)}`);
        bkOcupados = new Set(r.map(s => s.data + '|' + s.hora));
      } catch (e) { bkOcupados = new Set(); }
    }

    async function bkInit() {
      await bkCarregarOcupados();
      bkData = null; bkHora = null; bkSemanas = 1; bkInicio = 0;
      bkRender();
    }

    function bkLivre(data, hora) {
      if (bkOcupados.has(data + '|' + hora)) return false;
      const agora = new Date();
      if (data === agora.toISOString().slice(0, 10) && Number(hora.slice(0, 2)) <= agora.getHours()) return false;
      return true;
    }

    function bkDatasSerie() {
      if (!bkData) return [];
      return [...Array(bkSemanas)].map((_, i) => {
        const d = new Date(bkData + 'T12:00:00');
        d.setDate(d.getDate() + i * 7);
        return d.toISOString().slice(0, 10);
      });
    }

    function bkRender() {
      const el = document.getElementById('bkComponente');
      if (!el) return;

      /* aviso do modo remarcação */
      const aviso = bkModo === 'remarcar' && bkReserva && bkReserva.sessaoSel
        ? `<div class="bk-aviso">🔁 Remarcando a sessão de <b>${fmtBR(bkReserva.sessoes.find(s => s.id === bkReserva.sessaoSel).data)} às ${bkReserva.sessoes.find(s => s.id === bkReserva.sessaoSel).hora}</b> — escolha o novo horário abaixo.
           <span class="ler-mais" onclick="bkSairRemarcar()">cancelar</span></div>`
        : '';

      /* faixa de dias */
      const dias = [...Array(7)].map((_, i) => {
        const off = bkInicio + i;
        const d = new Date(); d.setDate(d.getDate() + off);
        const iso = d.toISOString().slice(0, 10);
        const domingo = d.getDay() === 0;
        return `<div class="bk-dia${iso === bkData ? ' sel' : ''}${domingo ? ' off' : ''}${off === 0 ? ' hoje' : ''}" onclick="bkSelDia('${iso}')">
          <div class="dw">${off === 0 ? 'Hoje' : DWS[d.getDay()]}</div>
          <div class="dn">${d.getDate()}</div>
          <div class="dm">${MES3[d.getMonth()]}</div>
        </div>`;
      }).join('');

      /* slots do dia */
      const slots = bkData ? HORAS.map(h => {
        const livre = bkLivre(bkData, h);
        return `<div class="bk-slot${!livre ? ' ocupado' : ''}${bkHora === h && livre ? ' sel' : ''}" onclick="bkSelHora('${h}')">${h}</div>`;
      }).join('') : '<div style="grid-column:1/-1;font-size:.84rem;color:var(--text-soft);padding:8px 0;">Escolha um dia acima para ver os horários.</div>';

      /* recorrência + confirmação */
      let rodape = '';
      if (bkData && bkHora) {
        if (bkModo === 'remarcar') {
          rodape = `<div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <span style="font-size:.86rem;font-weight:700;color:var(--ink);">Novo horário: ${fmtBR(bkData)} às ${bkHora}</span>
            <button class="btn btn-primary" onclick="bkConfirmarRemarcacao()">Confirmar remarcação</button>
          </div>`;
        } else {
          const serie = bkDatasSerie();
          rodape = `
            <div class="bk-rec">
              ${[[1, 'Só uma vez'], [4, 'Semanal · 4 semanas'], [8, 'Semanal · 8 semanas'], [12, 'Semanal · 12 semanas']]
                .map(([n, l]) => `<button class="chip${bkSemanas === n ? ' active' : ''}" onclick="bkSelSemanas(${n})">${l}</button>`).join('')}
            </div>
            ${bkSemanas > 1 ? `<div class="bk-preview">${serie.map(d =>
              `<span class="${bkLivre(d, bkHora) ? '' : 'conf'}">${fmtBR(d)}</span>`).join('')}</div>
              ${serie.some(d => !bkLivre(d, bkHora)) ? '<div style="font-size:.74rem;color:var(--red);margin-top:6px;">Datas riscadas estão ocupadas e ficarão de fora — dá para remarcar depois com seu código.</div>' : ''}` : ''}
            <div class="bk-form">
              <div class="field"><label>Seu nome *</label><input type="text" id="bkNome"></div>
              <div class="field"><label>WhatsApp *</label><input type="tel" id="bkTel" placeholder="(11) 9 0000-0000"></div>
              <div class="field full"><label>O que você está sentindo? (opcional)</label><input type="text" id="bkObs" placeholder="Ex.: dor no joelho ao subir escadas"></div>
              <div class="full" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                <button class="btn btn-primary" style="padding:12px 26px;" id="bkBtn" onclick="bkConfirmar()">
                  Confirmar ${bkSemanas > 1 ? bkSemanas + ' sessões' : 'agendamento'} · ${fmtBR(bkData)} às ${bkHora}
                </button>
              </div>
            </div>`;
        }
      }

      el.innerHTML = `${aviso}
        <div class="bk-dias">
          <button class="nav" onclick="bkNav(-7)" ${bkInicio === 0 ? 'disabled style="opacity:.3;"' : ''}>‹</button>
          <div class="bk-strip">${dias}</div>
          <button class="nav" onclick="bkNav(7)" ${bkInicio >= 84 ? 'disabled style="opacity:.3;"' : ''}>›</button>
        </div>
        <div class="bk-slots">${slots}</div>
        ${rodape}`;
    }

    function bkNav(d) { bkInicio = Math.min(Math.max(bkInicio + d, 0), 84); bkRender(); }
    function bkSelDia(iso) { bkData = iso; bkHora = null; bkRender(); }
    function bkSelHora(h) { if (bkData && bkLivre(bkData, h)) { bkHora = h; bkRender(); const f = document.getElementById('bkNome'); } }
    function bkSelSemanas(n) { bkSemanas = n; bkRender(); }

    async function bkConfirmar() {
      const nome = document.getElementById('bkNome').value.trim();
      const tel = document.getElementById('bkTel').value.trim();
      if (!nome || !tel) { App.toast('Informe seu nome e WhatsApp', 'error'); return; }
      const btn = document.getElementById('bkBtn'); btn.disabled = true; btn.textContent = 'Agendando…';
      try {
        const r = await PF.api('/api/public/agendar', { method: 'POST', body: {
          fisio_id: fisioId, nome, telefone: tel, data: bkData, hora: bkHora,
          semanas: bkSemanas, obs: document.getElementById('bkObs').value.trim() || null,
        }});
        document.getElementById('bkComponente').innerHTML = `
          <div class="bk-ok">
            <div style="font-size:2.2rem;">✅</div>
            <div style="font-size:1.05rem;font-weight:800;color:var(--ink);margin-top:6px;">Agendamento confirmado com ${r.fisio_nome.split(' ')[0]}!</div>
            <div class="cod">${r.codigo}</div>
            <div style="font-size:.82rem;color:var(--text-soft);">Guarde este código — com ele você remarca ou cancela quando precisar.</div>
            <div class="bk-preview" style="justify-content:center;margin-top:14px;">
              ${r.criadas.map(d => `<span>📅 ${fmtBR(d)} às ${r.hora}</span>`).join('')}
              ${r.conflitos.map(d => `<span class="conf">${fmtBR(d)} ocupado</span>`).join('')}
            </div>
            <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
              <button class="btn btn-ghost btn-sm" onclick="bkInit()">Fazer outro agendamento</button>
            </div>
          </div>`;
      } catch (e) {
        App.toast(e.message, 'error');
        await bkCarregarOcupados();
        bkRender();
      }
    }

    /* ---------- remarcar / cancelar ---------- */
    async function abrirRemarcar() {
      const codigo = prompt('Digite o código do seu agendamento (ex.: PF-AB12CD):');
      if (!codigo) return;
      try {
        const sessoes = await PF.api('/api/public/reserva/' + codigo.trim().toUpperCase());
        bkReserva = { codigo: codigo.trim().toUpperCase(), sessoes, sessaoSel: null };
        bkModo = 'remarcar';
        bkRenderReserva();
        irAgenda();
      } catch (e) { App.toast(e.message, 'error'); }
    }

    function bkRenderReserva() {
      const r = bkReserva;
      document.getElementById('bkComponente').innerHTML = `
        <div class="bk-aviso">🔑 Reserva <b>${r.codigo}</b> · ${r.sessoes.length} sessão(ões) futura(s). Escolha uma para remarcar ou cancelar:</div>
        ${r.sessoes.map(s => `
          <div class="bk-sessao">
            <span style="flex:1;font-size:.88rem;"><b>${fmtBR(s.data)}</b> às <b>${s.hora}</b> · ${s.tipo}</span>
            <button class="btn btn-soft btn-sm" onclick="bkEscolherRemarcar('${s.id}')">🔁 Remarcar</button>
            <button class="btn btn-danger btn-sm" onclick="bkCancelarSessao('${s.id}')">Cancelar</button>
          </div>`).join('')}
        <div style="margin-top:10px;"><span class="ler-mais" onclick="bkSairRemarcar()">← Voltar ao agendamento</span></div>`;
    }

    function bkEscolherRemarcar(id) {
      bkReserva.sessaoSel = id;
      bkData = null; bkHora = null;
      bkRender();
    }

    async function bkConfirmarRemarcacao() {
      try {
        const r = await PF.api(`/api/public/reserva/${bkReserva.codigo}/remarcar`, { method: 'POST', body: {
          sessao_id: bkReserva.sessaoSel, data: bkData, hora: bkHora,
        }});
        App.toast(`Sessão remarcada para ${fmtBR(r.data)} às ${r.hora}! ✅`);
        await bkCarregarOcupados();
        const sessoes = await PF.api('/api/public/reserva/' + bkReserva.codigo);
        bkReserva = { ...bkReserva, sessoes, sessaoSel: null };
        bkRenderReserva();
      } catch (e) {
        App.toast(e.message, 'error');
        await bkCarregarOcupados();
        bkRender();
      }
    }

    async function bkCancelarSessao(id) {
      if (!confirm('Cancelar esta sessão?')) return;
      try {
        await PF.api(`/api/public/reserva/${bkReserva.codigo}/cancelar`, { method: 'POST', body: { sessao_id: id } });
        App.toast('Sessão cancelada.');
        await bkCarregarOcupados();
        try {
          const sessoes = await PF.api('/api/public/reserva/' + bkReserva.codigo);
          bkReserva.sessoes = sessoes;
          bkRenderReserva();
        } catch (e) { bkSairRemarcar(); }
      } catch (e) { App.toast(e.message, 'error'); }
    }

    function bkSairRemarcar() {
      bkModo = 'novo'; bkReserva = null; bkData = null; bkHora = null;
      bkRender();
    }

    function toggleSobre() {
      const t = document.getElementById('sobreTxt');
      const aberto = !t.classList.contains('fechado');
      t.classList.toggle('fechado');
      document.getElementById('lerMais').textContent = aberto ? 'Ler mais' : 'Ler menos';
    }

    async function iniciarMapa() {
      if (PRO.lat == null) return;
      let token = null;
      try { token = (await PF.api('/api/public/config')).mapbox; } catch (e) {}
      if (!token) return;
      await new Promise(res => {
        const css = document.createElement('link');
        css.rel = 'stylesheet'; css.href = 'https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css';
        document.head.appendChild(css);
        const s = document.createElement('script');
        s.src = 'https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js';
        s.onload = res; s.onerror = res;
        document.head.appendChild(s);
      });
      if (!window.mapboxgl) return;
      const el = document.getElementById('mapaFisio');
      el.style.display = 'block';
      mapboxgl.accessToken = token;
      const m = new mapboxgl.Map({ container: el, style: 'mapbox://styles/mapbox/light-v11', center: [PRO.lng, PRO.lat], zoom: 13.5 });
      new mapboxgl.Marker({ color: '#0DA189' }).setLngLat([PRO.lng, PRO.lat]).addTo(m);
    }

    async function enviarSolicitacao() {
      if (!avNome.value.trim()) { App.toast('Informe seu nome', 'error'); return; }
      const btn = document.getElementById('btnAv'); btn.disabled = true;
      try {
        await PF.api('/api/public/leads-profissional', { method: 'POST', body: {
          fisio_id: fisioId, nome: avNome.value.trim(), telefone: avTel.value.trim() || null, obs: avObs.value.trim() || null,
        }});
        App.closeModal('mAvaliacao');
        App.toast('Solicitação enviada! ' + PRO.nome.split(' ')[0] + ' entrará em contato. ✅');
        avNome.value = ''; avTel.value = ''; avObs.value = '';
      } catch (e) { App.toast(e.message, 'error'); }
      btn.disabled = false;
    }

    boot();
  </script>
</body>
</html>
