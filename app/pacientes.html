<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacientes — PerFisio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../assets/img/simbolo-perfisio.svg">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-page="pacientes" data-title="Pacientes" data-subtitle="Cadastro e acompanhamento de todos os pacientes da clínica">

  <div class="page-head">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1;">
      <div style="display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-width:240px;">
        🔍 <input id="buscaPac" type="text" placeholder="Buscar por nome, telefone ou queixa..." style="border:none;background:none;outline:none;width:100%;font-size:.85rem;">
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;" id="filterChips"></div>
    </div>
    <button class="btn btn-primary" onclick="abrirNovo()">+ Novo paciente</button>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table class="data">
        <thead>
          <tr><th>Paciente</th><th>Queixa</th><th>Fisioterapeuta</th><th>Pacote</th><th>Progresso</th><th>Status</th></tr>
        </thead>
        <tbody id="patRows"><tr><td colspan="6" class="empty">Carregando...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- MODAL NOVO/EDITAR PACIENTE -->
  <div class="modal-overlay" id="mPaciente">
    <div class="modal wide">
      <div class="modal-head">
        <h3 id="mPacTitulo">Novo paciente</h3>
        <button class="close" onclick="App.closeModal('mPaciente')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field"><label>Nome completo *</label><input type="text" id="fNome"></div>
          <div class="field"><label>Data de nascimento</label><input type="date" id="fNasc"></div>
          <div class="field"><label>CPF</label><input type="text" id="fCpf" placeholder="000.000.000-00"></div>
          <div class="field"><label>Telefone / WhatsApp</label><input type="text" id="fTel" placeholder="(11) 9 0000-0000"></div>
          <div class="field"><label>E-mail</label><input type="email" id="fEmail"></div>
          <div class="field"><label>Convênio</label>
            <select id="fConv"><option>Particular</option><option>Unimed</option><option>Bradesco Saúde</option><option>SulAmérica</option><option>Amil</option><option>Outro</option></select>
          </div>
          <div class="field full"><label>Queixa principal</label><input type="text" id="fQueixa" placeholder="Ex.: dor lombar há 3 meses, irradiando para perna direita"></div>
          <div class="field"><label>Fisioterapeuta responsável</label><select id="fFisio"></select></div>
          <div class="field"><label>Status</label>
            <select id="fStatus"><option value="avaliacao">Em avaliação</option><option value="tratamento">Em tratamento</option><option value="alta">Alta</option><option value="inativo">Inativo</option></select>
          </div>
          <div class="field"><label>Pacote</label><select id="fPacote"></select></div>
          <div class="field"><label>Sessões já realizadas</label><input type="number" id="fFeitas" value="0" min="0"></div>
          <div class="field full"><label>Observações</label><textarea id="fObs" placeholder="Histórico relevante, medicamentos, restrições..."></textarea></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-danger" id="btnExcluir" style="margin-right:auto;display:none;" onclick="excluirPaciente()">Excluir</button>
        <button class="btn btn-ghost" onclick="App.closeModal('mPaciente')">Cancelar</button>
        <button class="btn btn-primary" id="btnSalvar" onclick="salvarPaciente()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script>
    let FISIOS = [], PACOTES = [], PACS = [];
    let filtro = 'todos', editId = null;
    let busca = new URLSearchParams(location.search).get('q') || '';
    const CORES = ['#0DA189','#2D7DD2','#7C5CBF','#D9820B','#D64545','#1E9E6A'];
    const STATUS = { tratamento:'<span class="badge green">Em tratamento</span>', avaliacao:'<span class="badge blue">Avaliação</span>', alta:'<span class="badge purple">Alta</span>', inativo:'<span class="badge gray">Inativo</span>' };

    async function boot() {
      [FISIOS, PACOTES, PACS] = await Promise.all([PF.get('fisios'), PF.get('pacotes'), PF.get('pacientes')]);
      document.getElementById('fFisio').innerHTML = '<option value="">A definir</option>' +
        FISIOS.filter(f=>f.ativo).map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
      document.getElementById('fPacote').innerHTML = '<option value="">Sem pacote</option>' +
        PACOTES.map(p => `<option value="${p.nome}|${p.sessoes}">${p.nome} (${p.sessoes} sessões · ${App.money(Number(p.valor))})</option>`).join('');
      render();
    }

    function chips() {
      const counts = s => s === 'todos' ? PACS.length : PACS.filter(p => p.status === s).length;
      const defs = [['todos','Todos'],['tratamento','Em tratamento'],['avaliacao','Em avaliação'],['alta','Alta'],['inativo','Inativos']];
      const el = document.getElementById('filterChips');
      el.innerHTML = defs.map(([s, l]) =>
        `<button class="chip${filtro === s ? ' active' : ''}" data-s="${s}">${l} <span style="font-weight:400;">${counts(s)}</span></button>`).join('');
      el.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { filtro = c.dataset.s; render(); }));
    }

    function render() {
      chips();
      let rows = PACS.filter(p => filtro === 'todos' || p.status === filtro);
      if (busca) {
        const q = busca.toLowerCase();
        rows = rows.filter(p => p.nome.toLowerCase().includes(q)
          || (p.telefone || '').toLowerCase().includes(q)
          || (p.queixa || '').toLowerCase().includes(q)
          || (p.convenio || '').toLowerCase().includes(q));
      }
      document.getElementById('patRows').innerHTML = rows.map((p, i) => {
        const f = FISIOS.find(x => x.id === p.fisio_id);
        const pct = p.sessoes_total ? Math.min(Math.round(p.sessoes_feitas / p.sessoes_total * 100), 100) : 0;
        const idade = PF.idade(p.nascimento);
        return `<tr onclick="abrirEditar('${p.id}')">
          <td><div class="cell-person"><span class="avatar-sm" style="background:${CORES[i % 6]};">${App.iniciais(p.nome)}</span><div><div class="p-name">${p.nome}</div><div class="p-sub">${idade ? idade + ' anos · ' : ''}${p.convenio || 'Particular'}${p.telefone ? ' · ' + p.telefone : ''}</div></div></div></td>
          <td>${p.queixa || '—'}</td>
          <td>${f ? f.nome : '<span style="color:var(--text-soft);">—</span>'}</td>
          <td>${p.pacote_nome || '—'}</td>
          <td>${p.sessoes_total ? `<div class="progress" style="width:90px;"><div style="width:${pct}%;"></div></div><span style="font-size:.72rem;color:var(--text-soft);">${p.sessoes_feitas}/${p.sessoes_total}</span>` : '<span style="color:var(--text-soft);font-size:.8rem;">—</span>'}</td>
          <td>${STATUS[p.status] || p.status} <a href="prontuarios.html?p=${p.id}" onclick="event.stopPropagation()" style="font-size:.74rem;color:var(--primary);font-weight:600;margin-left:6px;">prontuário →</a></td>
        </tr>`;
      }).join('') || `<tr><td colspan="6" class="empty">${busca ? 'Nenhum paciente encontrado para "' + busca + '".' : 'Nenhum paciente neste filtro. Clique em <b>+ Novo paciente</b> para começar.'}</td></tr>`;
    }

    function limparForm() {
      ['fNome','fNasc','fCpf','fTel','fEmail','fQueixa','fObs'].forEach(id => document.getElementById(id).value = '');
      fConv.value = 'Particular'; fStatus.value = 'avaliacao'; fFisio.value = ''; fPacote.value = ''; fFeitas.value = 0;
    }

    function abrirNovo() {
      editId = null; limparForm();
      document.getElementById('mPacTitulo').textContent = 'Novo paciente';
      document.getElementById('btnExcluir').style.display = 'none';
      App.openModal('mPaciente');
    }

    function abrirEditar(id) {
      const p = PACS.find(x => x.id === id);
      if (!p) return;
      editId = id;
      fNome.value = p.nome; fNasc.value = p.nascimento ? p.nascimento.slice(0,10) : '';
      fCpf.value = p.cpf || ''; fTel.value = p.telefone || ''; fEmail.value = p.email || '';
      fConv.value = p.convenio || 'Particular'; fQueixa.value = p.queixa || ''; fObs.value = p.obs || '';
      fFisio.value = p.fisio_id || ''; fStatus.value = p.status; fFeitas.value = p.sessoes_feitas;
      const opt = [...fPacote.options].find(o => o.value.startsWith((p.pacote_nome || '') + '|'));
      fPacote.value = opt ? opt.value : '';
      document.getElementById('mPacTitulo').textContent = p.nome;
      document.getElementById('btnExcluir').style.display = '';
      App.openModal('mPaciente');
    }

    async function salvarPaciente() {
      if (!fNome.value.trim()) { App.toast('Informe o nome do paciente', 'error'); return; }
      const [pacNome, pacSessoes] = fPacote.value ? fPacote.value.split('|') : [null, 0];
      const body = {
        nome: fNome.value.trim(), nascimento: fNasc.value || null, cpf: fCpf.value.trim() || null,
        telefone: fTel.value.trim() || null, email: fEmail.value.trim() || null, convenio: fConv.value,
        queixa: fQueixa.value.trim() || null, obs: fObs.value.trim() || null,
        fisio_id: fFisio.value || null, status: fStatus.value,
        pacote_nome: pacNome, sessoes_total: Number(pacSessoes) || 0, sessoes_feitas: Number(fFeitas.value) || 0,
      };
      const btn = document.getElementById('btnSalvar'); btn.disabled = true;
      try {
        if (editId) await PF.put('pacientes', editId, body);
        else await PF.post('pacientes', body);
        App.closeModal('mPaciente');
        App.toast(editId ? 'Paciente atualizado!' : 'Paciente cadastrado!');
        PACS = await PF.get('pacientes');
        render();
      } catch (e) { App.toast(e.message, 'error'); }
      btn.disabled = false;
    }

    async function excluirPaciente() {
      if (!editId || !confirm('Excluir este paciente e todo o histórico (sessões, evoluções, anexos)?')) return;
      try {
        await PF.del('pacientes', editId);
        App.closeModal('mPaciente');
        App.toast('Paciente excluído');
        PACS = await PF.get('pacientes');
        render();
      } catch (e) { App.toast(e.message, 'error'); }
    }

    const buscaInput = document.getElementById('buscaPac');
    buscaInput.value = busca;
    buscaInput.addEventListener('input', e => { busca = e.target.value.trim(); render(); });

    boot().catch(e => App.toast(e.message, 'error'));
  </script>
</body>
</html>
