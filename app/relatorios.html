<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios — PerFisio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../assets/img/simbolo-perfisio.svg">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-page="relatorios" data-title="Relatórios" data-subtitle="Indicadores da clínica · últimos 6 meses">

  <div class="page-head">
    <div style="font-size:.85rem;color:var(--text-soft);" id="periodo"></div>
    <button class="btn btn-ghost" onclick="window.print()">🖨 Imprimir / PDF</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="s-top"><span class="s-label">Sessões realizadas (6m)</span><div class="s-ico" style="background:var(--primary-soft);">📅</div></div>
      <div class="s-value" id="stSessoes">—</div>
      <div class="s-delta"><span class="muted" id="stSessoesSub"></span></div>
    </div>
    <div class="stat-card">
      <div class="s-top"><span class="s-label">Novos pacientes (6m)</span><div class="s-ico" style="background:var(--blue-soft);">🆕</div></div>
      <div class="s-value" id="stNovos">—</div>
      <div class="s-delta"><span class="muted" id="stNovosSub"></span></div>
    </div>
    <div class="stat-card">
      <div class="s-top"><span class="s-label">Taxa de faltas</span><div class="s-ico" style="background:var(--amber-soft);">🚫</div></div>
      <div class="s-value" id="stFaltas">—</div>
      <div class="s-delta"><span class="muted" id="stFaltasSub"></span></div>
    </div>
    <div class="stat-card">
      <div class="s-top"><span class="s-label">Receita total (6m)</span><div class="s-ico" style="background:var(--green-soft);">💰</div></div>
      <div class="s-value" id="stReceita">—</div>
      <div class="s-delta"><span class="muted" id="stReceitaSub"></span></div>
    </div>
  </div>

  <div class="grid-2-eq">
    <div class="card card-pad">
      <h3 style="font-size:.98rem;margin-bottom:18px;">Sessões realizadas por mês</h3>
      <div class="bar-chart" id="chartSessoes"></div>
    </div>
    <div class="card card-pad">
      <h3 style="font-size:.98rem;margin-bottom:18px;">Receita por mês</h3>
      <div class="bar-chart" id="chartReceita"></div>
    </div>
    <div class="card card-pad">
      <h3 style="font-size:.98rem;margin-bottom:18px;">Receita por profissional (6m)</h3>
      <div id="chartFisios"></div>
    </div>
    <div class="card card-pad">
      <h3 style="font-size:.98rem;margin-bottom:18px;">Origem dos leads</h3>
      <div id="chartOrigem"></div>
    </div>
    <div class="card card-pad">
      <h3 style="font-size:.98rem;margin-bottom:18px;">Status dos pacientes</h3>
      <div id="chartStatus"></div>
    </div>
    <div class="card card-pad">
      <h3 style="font-size:.98rem;margin-bottom:14px;">Funil de captação (CRM)</h3>
      <div id="chartFunil"></div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script>
    const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    const agora = new Date();
    // últimos 6 meses (inclui o atual)
    const meses = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(agora.getFullYear(), agora.getMonth() - i, 1);
      meses.push({ y: d.getFullYear(), m: d.getMonth(), key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}` });
    }
    const from = `${meses[0].key}-01`;
    const to = PF.hojeISO().slice(0, 8) + '31';
    document.getElementById('periodo').textContent =
      `Período: ${MESES_ABREV[meses[0].m]}/${meses[0].y} a ${MESES_ABREV[meses[5].m]}/${meses[5].y}`;

    function barChart(el, valores, fmt = v => v) {
      const max = Math.max(...valores, 1);
      document.getElementById(el).innerHTML = valores.map((v, i) => `
        <div class="bc-item">
          <span class="bc-val">${fmt(v)}</span>
          <div class="bc-bar${i === 5 ? '' : ' muted'}" style="height:${Math.max(Math.round(v / max * 100), 2)}%;"></div>
          <span class="bc-label">${MESES_ABREV[meses[i].m]}</span>
        </div>`).join('');
    }

    function hbars(el, dados, fmt = v => v) {
      // dados: [[nome, valor, cor?]]
      const max = Math.max(...dados.map(d => d[1]), 1);
      document.getElementById(el).innerHTML = dados.map(([n, v, c]) => `
        <div class="hbar">
          <div class="hb-top"><span class="hb-name">${n}</span><span class="hb-val">${fmt(v)}</span></div>
          <div class="hb-track"><div class="hb-fill" style="width:${Math.round(v / max * 100)}%;background:${c || 'var(--primary)'};"></div></div>
        </div>`).join('') || '<div class="empty">Sem dados no período.</div>';
    }

    async function boot() {
      const [sessoes, pagamentos, pacientes, leads, fisios] = await Promise.all([
        PF.get('sessoes', { from, to }), PF.get('pagamentos'), PF.get('pacientes'), PF.get('leads'), PF.get('fisios'),
      ]);

      /* stats */
      const realizadas = sessoes.filter(s => s.status === 'realizada');
      const faltas = sessoes.filter(s => s.status === 'falta');
      document.getElementById('stSessoes').textContent = realizadas.length;
      document.getElementById('stSessoesSub').textContent = sessoes.filter(s => s.status === 'agendada').length + ' ainda agendadas';
      const novos = pacientes.filter(p => p.criado_em.slice(0, 7) >= meses[0].key);
      document.getElementById('stNovos').textContent = novos.length;
      const doSite = leads.filter(l => l.origem === 'Site PerFisio').length;
      document.getElementById('stNovosSub').textContent = leads.length ? `${Math.round(doSite / leads.length * 100)}% dos leads vêm do site PerFisio` : 'cadastre leads no CRM';
      document.getElementById('stFaltas').textContent = (realizadas.length + faltas.length)
        ? (faltas.length / (realizadas.length + faltas.length) * 100).toFixed(1).replace('.', ',') + '%' : '—';
      document.getElementById('stFaltasSub').textContent = faltas.length + ' faltas no período';
      const pagos = pagamentos.filter(p => p.status === 'pago' && ((p.vencimento || p.criado_em) || '').slice(0, 7) >= meses[0].key);
      const receitaTotal = pagos.reduce((a, p) => a + Number(p.valor), 0);
      document.getElementById('stReceita').textContent = App.money(receitaTotal);
      document.getElementById('stReceitaSub').textContent = pagos.length + ' pagamentos recebidos';

      /* barras mensais */
      barChart('chartSessoes', meses.map(m => realizadas.filter(s => s.data.slice(0, 7) === m.key).length));
      barChart('chartReceita', meses.map(m => pagos.filter(p => ((p.vencimento || p.criado_em) || '').slice(0, 7) === m.key).reduce((a, p) => a + Number(p.valor), 0)), v => v ? App.moneyShort(v) : '0');

      /* receita por fisio */
      hbars('chartFisios', fisios.filter(f => f.ativo).map(f => {
        const idsPacs = pacientes.filter(p => p.fisio_id === f.id).map(p => p.id);
        const v = pagos.filter(p => idsPacs.includes(p.paciente_id)).reduce((a, p) => a + Number(p.valor), 0);
        return [f.nome, v, f.cor];
      }).sort((a, b) => b[1] - a[1]), v => App.money(v));

      /* origem dos leads */
      const ORIG_ICO = { 'Site PerFisio': '🌐', 'Instagram': '📸', 'Google': '🔎', 'Indicação médica': '🩺', 'Indicação de paciente': '🤝', 'Convênio': '🏥' };
      const origens = {};
      leads.forEach(l => { origens[l.origem || 'Outro'] = (origens[l.origem || 'Outro'] || 0) + 1; });
      hbars('chartOrigem', Object.entries(origens).map(([n, v]) => [(ORIG_ICO[n] || '•') + ' ' + n, v]).sort((a, b) => b[1] - a[1]), v => v + ' lead(s)');

      /* status dos pacientes */
      const ST = { tratamento: ['Em tratamento', 'var(--green)'], avaliacao: ['Em avaliação', 'var(--blue)'], alta: ['Alta', 'var(--purple)'], inativo: ['Inativos', '#94A8A5'] };
      hbars('chartStatus', Object.entries(ST).map(([k, [n, c]]) => [n, pacientes.filter(p => p.status === k).length, c]), v => v);

      /* funil */
      const COLS = [['novo', 'Novo contato'], ['contato', 'Contato feito'], ['avaliacao', 'Avaliação agendada'], ['proposta', 'Plano proposto'], ['convertido', 'Convertido']];
      hbars('chartFunil', COLS.map(([k, n]) => [n, leads.filter(l => l.col === k).length, 'var(--primary)']), v => v);
    }

    boot().catch(e => App.toast(e.message, 'error'));
  </script>
</body>
</html>
