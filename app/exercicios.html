<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios — PerFisio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-page="exercicios" data-title="Biblioteca de Exercícios" data-subtitle="Monte prescrições e registre no prontuário do paciente">

  <div class="page-head">
    <div style="display:flex;gap:8px;flex-wrap:wrap;" id="catChips"></div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-soft" id="btnPrescrever" onclick="prescrever()">📤 Prescrever selecionados (0)</button>
      <button class="btn btn-primary" onclick="App.openModal('mExercicio')">+ Novo exercício</button>
    </div>
  </div>

  <div class="ex-grid" id="exGrid"><div class="empty">Carregando...</div></div>

  <!-- MODAL NOVO EXERCÍCIO -->
  <div class="modal-overlay" id="mExercicio">
    <div class="modal">
      <div class="modal-head">
        <h3>Novo exercício</h3>
        <button class="close" onclick="App.closeModal('mExercicio')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field full"><label>Nome do exercício *</label><input type="text" id="xNome" placeholder="Ex.: Agachamento isométrico na parede"></div>
          <div class="field"><label>Categoria</label>
            <select id="xCat"><option value="coluna">Coluna</option><option value="joelho">Joelho</option><option value="ombro">Ombro</option><option value="quadril">Quadril</option><option value="neuro">Neuro</option><option value="pilates">Pilates</option></select>
          </div>
          <div class="field"><label>Nível</label>
            <select id="xNivel"><option>Iniciante</option><option>Intermediário</option><option>Avançado</option></select>
          </div>
          <div class="field"><label>Séries × repetições</label><input type="text" id="xReps" placeholder="3 × 12"></div>
          <div class="field"><label>Emoji</label><input type="text" id="xEmoji" placeholder="💪" maxlength="4"></div>
          <div class="field full"><label>Vídeo (link)</label><input type="url" id="xVideo" placeholder="https://youtube.com/..."></div>
          <div class="field full"><label>Instruções para o paciente</label><textarea id="xInstr" placeholder="Descreva a execução em linguagem simples..."></textarea></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="App.closeModal('mExercicio')">Cancelar</button>
        <button class="btn btn-primary" id="btnEx" onclick="salvarExercicio()">Salvar exercício</button>
      </div>
    </div>
  </div>

  <!-- MODAL PRESCRIÇÃO -->
  <div class="modal-overlay" id="mPrescricao">
    <div class="modal">
      <div class="modal-head">
        <h3>Prescrever exercícios</h3>
        <button class="close" onclick="App.closeModal('mPrescricao')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field full"><label>Paciente *</label><select id="prPaciente"></select></div>
          <div class="field"><label>Frequência</label>
            <select id="prFreq"><option>Diária</option><option>2x ao dia</option><option>3x por semana</option><option>Dias de sessão</option></select>
          </div>
          <div class="field"><label>Duração do programa</label>
            <select id="prDur"><option>2 semanas</option><option>4 semanas</option><option>Até reavaliação</option></select>
          </div>
        </div>
        <div id="prItens" style="margin-top:12px;font-size:.85rem;color:var(--text-soft);"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="App.closeModal('mPrescricao')">Cancelar</button>
        <button class="btn btn-primary" id="btnPr" onclick="salvarPrescricao()">Salvar prescrição</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script>
    const NIVEL_BADGE = { 'Iniciante': 'green', 'Intermediário': 'amber', 'Avançado': 'red' };
    const BGS = { coluna: '#E1F4F0', joelho: '#E3F5ED', ombro: '#E7F0FA', quadril: '#FCF1DE', neuro: '#F0EBFA', pilates: '#FBE9E9' };
    let EX = [], PACS = [], cat = 'todos';
    const selecionados = new Set();

    async function boot() {
      [EX, PACS] = await Promise.all([PF.get('exercicios'), PF.get('pacientes')]);
      document.getElementById('prPaciente').innerHTML = PACS.filter(p => p.status !== 'inativo')
        .map(p => `<option value="${p.id}">${p.nome}</option>`).join('') || '<option value="">Nenhum paciente cadastrado</option>';
      renderChips(); render();
    }

    function renderChips() {
      const cats = [['todos','Todos'],['coluna','Coluna'],['joelho','Joelho'],['ombro','Ombro'],['quadril','Quadril'],['neuro','Neuro'],['pilates','Pilates']];
      const el = document.getElementById('catChips');
      el.innerHTML = cats.map(([c, l]) => `<button class="chip${cat === c ? ' active' : ''}" data-c="${c}">${l}</button>`).join('');
      el.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { cat = c.dataset.c; renderChips(); render(); }));
    }

    function render() {
      const items = EX.filter(e => cat === 'todos' || e.cat === cat);
      document.getElementById('exGrid').innerHTML = items.map(e => {
        const on = selecionados.has(e.id);
        return `<div class="ex-card" onclick="toggleSel('${e.id}')" style="${on ? 'outline:2px solid var(--primary);' : ''}">
          <div class="e-img" style="background:${BGS[e.cat] || '#E1F4F0'};">
            ${e.emoji || '💪'}
            <span class="e-badge badge ${NIVEL_BADGE[e.nivel] || 'gray'}">${e.nivel}</span>
            ${on ? '<span class="e-badge badge primary" style="left:auto;right:10px;">✓</span>' : ''}
          </div>
          <div class="e-body">
            <div class="e-title">${e.nome} <button style="float:right;background:none;border:none;color:var(--text-soft);font-size:.78rem;" title="Excluir" onclick="excluirEx(event,'${e.id}')">✕</button></div>
            <div class="e-sub">${e.cat.charAt(0).toUpperCase() + e.cat.slice(1)}${e.instrucoes ? ' · ' + e.instrucoes.slice(0, 60) : ''}</div>
            <div class="e-specs"><span>🔁 ${e.reps || '—'}</span>${e.video ? `<a href="${e.video}" target="_blank" onclick="event.stopPropagation()" style="color:var(--primary);font-weight:600;">🎥 vídeo</a>` : ''}</div>
          </div>
        </div>`;
      }).join('') || '<div class="empty">Nenhum exercício nesta categoria. Clique em <b>+ Novo exercício</b>.</div>';
      document.getElementById('btnPrescrever').textContent = `📤 Prescrever selecionados (${selecionados.size})`;
    }

    function toggleSel(id) { selecionados.has(id) ? selecionados.delete(id) : selecionados.add(id); render(); }

    function prescrever() {
      if (!selecionados.size) { App.toast('Selecione ao menos um exercício clicando nos cards', 'info'); return; }
      if (!PACS.length) { App.toast('Cadastre um paciente primeiro', 'error'); return; }
      document.getElementById('prItens').innerHTML = '<b style="color:var(--ink);">Exercícios:</b> ' +
        [...selecionados].map(id => EX.find(e => e.id === id).nome).join(' · ');
      App.openModal('mPrescricao');
    }

    async function salvarPrescricao() {
      const btn = document.getElementById('btnPr'); btn.disabled = true;
      try {
        const itens = [...selecionados].map(id => { const e = EX.find(x => x.id === id); return { id: e.id, nome: e.nome, reps: e.reps }; });
        await PF.post('prescricoes', { paciente_id: prPaciente.value, itens, freq: prFreq.value, duracao: prDur.value });
        App.closeModal('mPrescricao');
        App.toast('Prescrição salva no prontuário do paciente!');
        selecionados.clear(); render();
      } catch (e) { App.toast(e.message, 'error'); }
      btn.disabled = false;
    }

    async function salvarExercicio() {
      if (!xNome.value.trim()) { App.toast('Informe o nome do exercício', 'error'); return; }
      const btn = document.getElementById('btnEx'); btn.disabled = true;
      try {
        await PF.post('exercicios', {
          nome: xNome.value.trim(), cat: xCat.value, nivel: xNivel.value,
          reps: xReps.value.trim() || null, emoji: xEmoji.value.trim() || '💪',
          video: xVideo.value.trim() || null, instrucoes: xInstr.value.trim() || null,
        });
        App.closeModal('mExercicio');
        ['xNome','xReps','xEmoji','xVideo','xInstr'].forEach(id => document.getElementById(id).value = '');
        App.toast('Exercício adicionado à biblioteca!');
        EX = await PF.get('exercicios');
        render();
      } catch (e) { App.toast(e.message, 'error'); }
      btn.disabled = false;
    }

    async function excluirEx(ev, id) {
      ev.stopPropagation();
      if (!confirm('Excluir este exercício da biblioteca?')) return;
      try { await PF.del('exercicios', id); selecionados.delete(id); EX = await PF.get('exercicios'); render(); }
      catch (e) { App.toast(e.message, 'error'); }
    }

    boot().catch(e => App.toast(e.message, 'error'));
  </script>
</body>
</html>
