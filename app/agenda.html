<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda — PerFisio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/app.css">
  <style>
    /* grade horária (vistas semana/dia) */
    .tg-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; box-shadow: var(--shadow); max-height: calc(100vh - 210px); }
    .tg { display: grid; min-width: 560px; }
    .tg-corner, .tg-head { position: sticky; top: 0; background: #F9FBFA; border-bottom: 1px solid var(--line); z-index: 2; }
    .tg-head { padding: 9px 6px; text-align: center; font-size: .72rem; font-weight: 600; color: var(--text-soft); border-left: 1px solid #EDF1F0; cursor: pointer; }
    .tg-head b { display: block; font-size: .95rem; color: var(--ink); }
    .tg-head.today { background: var(--primary-soft); }
    .tg-head.today b { color: var(--primary-dark); }
    .tg-hora { padding: 6px 8px; font-size: .68rem; font-weight: 700; color: var(--text-soft); text-align: right; border-bottom: 1px solid #F0F4F3; }
    .tg-cell { border-left: 1px solid #EDF1F0; border-bottom: 1px solid #F0F4F3; min-height: 40px; padding: 3px 4px; cursor: pointer; transition: background .12s; }
    .tg-cell:hover { background: var(--primary-soft); }
  </style>
</head>
<body data-page="agenda" data-title="Agenda" data-subtitle="Sessões, avaliações e turmas da clínica">

  <div class="cal-toolbar">
    <div class="cal-nav">
      <button onclick="mudarPeriodo(-1)">‹</button>
      <button onclick="mudarPeriodo(1)">›</button>
      <button onclick="irHoje()" style="width:auto;padding:0 12px;font-size:.78rem;font-weight:600;">Hoje</button>
    </div>
    <div class="cal-month" id="calMonth"></div>
    <div style="display:flex;gap:4px;" id="vistaChips">
      <button class="chip active" data-v="mes">Mês</button>
      <button class="chip" data-v="semana">Semana</button>
      <button class="chip" data-v="dia">Dia</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;" id="fisioChips"></div>
    <div style="flex:1;"></div>
    <button class="btn btn-primary" onclick="abrirNova()">+ Nova sessão</button>
  </div>

  <div class="grid-2">
    <div class="cal-grid" id="calGrid"></div>

    <div class="card">
      <div class="card-header"><h3 id="dayTitle">—</h3></div>
      <div class="card-pad day-list" id="dayList"><div class="empty">Carregando...</div></div>
    </div>
  </div>

  <!-- MODAL NOVA SESSÃO -->
  <div class="modal-overlay" id="mSessao">
    <div class="modal">
      <div class="modal-head">
        <h3>Nova sessão</h3>
        <button class="close" onclick="App.closeModal('mSessao')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field full"><label>Paciente (ou deixe vazio p/ turma)</label>
            <select id="fPaciente"></select>
          </div>
          <div class="field full" id="fNovoPacWrap" style="display:none;background:var(--primary-soft);border-radius:10px;padding:12px 14px;">
            <div style="font-size:.78rem;font-weight:700;color:var(--primary-dark);margin-bottom:8px;">🆕 Novo paciente</div>
            <div class="form-grid">
              <div class="field"><label>Nome completo *</label><input type="text" id="npNome"></div>
              <div class="field"><label>Telefone / WhatsApp</label><input type="text" id="npTel" placeholder="(11) 9 0000-0000"></div>
              <div class="field full"><label>Convênio</label>
                <select id="npConv"><option>Particular</option><option>Unimed</option><option>Bradesco Saúde</option><option>SulAmérica</option><option>Amil</option><option>Outro</option></select>
              </div>
            </div>
            <div style="font-size:.72rem;color:var(--text-soft);margin-top:8px;">O cadastro completo pode ser feito depois em Pacientes.</div>
          </div>
          <div class="field full" id="fTratWrap" style="display:none;"><label>Ocorrência / tratamento</label>
            <select id="fTrat"></select>
          </div>
          <div class="field full" id="fNovoTratWrap" style="display:none;background:var(--primary-soft);border-radius:10px;padding:12px 14px;">
            <div style="font-size:.78rem;font-weight:700;color:var(--primary-dark);margin-bottom:8px;">🩺 Nova ocorrência</div>
            <div class="form-grid">
              <div class="field"><label>Título</label><input type="text" id="ntTitulo" placeholder="Ex.: Dor no joelho direito (padrão: Avaliação inicial)"></div>
              <div class="field"><label>Região</label>
                <select id="ntRegiao">
                  <option value="outro">🩺 A definir na avaliação</option>
                  <option value="cervical">🦴 Cervical / pescoço</option>
                  <option value="ombro">💪 Ombro</option>
                  <option value="cotovelo">💪 Cotovelo</option>
                  <option value="punho">🖐 Punho / mão</option>
                  <option value="coluna">🦴 Coluna torácica</option>
                  <option value="lombar">🦴 Coluna lombar</option>
                  <option value="quadril">🦿 Quadril</option>
                  <option value="joelho">🦵 Joelho</option>
                  <option value="tornozelo">🦶 Tornozelo / pé</option>
                  <option value="neuro">🧠 Neurológico</option>
                  <option value="respiratorio">🫁 Respiratório</option>
                </select>
              </div>
            </div>
          </div>
          <div class="field full" id="fTituloWrap" style="display:none;"><label>Título (turma / bloqueio)</label><input type="text" id="fTitulo" placeholder="Ex.: Pilates — turma das 15h"></div>
          <div class="field"><label>Fisioterapeuta</label><select id="fFisio"></select></div>
          <div class="field"><label>Tipo</label>
            <select id="fTipo"><option>Sessão de tratamento</option><option>Avaliação inicial</option><option>Reavaliação</option><option>Pilates (turma)</option><option>Domiciliar</option></select>
          </div>
          <div class="field"><label>Data</label><input type="date" id="fData"></div>
          <div class="field"><label>Horário</label><input type="time" id="fHora" value="09:00"></div>
          <div class="field"><label>Duração</label>
            <select id="fDuracao"><option>50 min</option><option>30 min</option><option>1h</option></select>
          </div>
          <div class="field"><label>Repetir (próximas 4 semanas)</label>
            <select id="fRepetir"><option value="0">Não repete</option><option value="1">Semanal</option><option value="2">2x por semana</option><option value="3">3x por semana</option></select>
          </div>
          <div class="field full"><label>Observações</label><textarea id="fObs" placeholder="Ex.: focar em mobilidade de quadril"></textarea></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="App.closeModal('mSessao')">Cancelar</button>
        <button class="btn btn-primary" id="btnSalvarSessao" onclick="salvarSessao()">Agendar sessão</button>
      </div>
    </div>
  </div>

  <!-- MODAL DETALHES DO EVENTO -->
  <div class="modal-overlay" id="mEvento">
    <div class="modal">
      <div class="modal-head">
        <h3 id="evmTitulo">Sessão</h3>
        <button class="close" onclick="App.closeModal('mEvento')">×</button>
      </div>
      <div class="modal-body" id="evmBody"></div>
      <div class="modal-foot" id="evmFoot" style="flex-wrap:wrap;"></div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script>
    const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    let ano, mes; // mes: 0-11
    { const d = new Date(); ano = d.getFullYear(); mes = d.getMonth(); }
    let filtro = 'todos', diaSel = new Date().getDate(), vista = 'mes';
    let FISIOS = [], PACS = [], EVENTOS = [];
    const hojeISO = PF.hojeISO();

    const iso = d => `${ano}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isoData = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    const ancora = () => new Date(ano, mes, diaSel);
    function semanaDe(d) {
      const i = new Date(d); i.setDate(d.getDate() - d.getDay());
      const f = new Date(i); f.setDate(i.getDate() + 6);
      return [i, f];
    }
    const fisioById = id => FISIOS.find(f => f.id === id);
    const pacById = id => PACS.find(p => p.id === id);
    const nomeEv = e => { const p = pacById(e.paciente_id); return p ? p.nome : (e.titulo || e.tipo); };

    let TRATS_ALL = [];
    const tratById = id => TRATS_ALL.find(t => t.id === id);

    async function boot() {
      [FISIOS, PACS, TRATS_ALL] = await Promise.all([PF.get('fisios'), PF.get('pacientes'), PF.get('tratamentos')]);
      document.getElementById('fFisio').innerHTML = FISIOS.filter(f=>f.ativo).map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
      document.getElementById('fPaciente').innerHTML = '<option value="">— Sem paciente (turma/bloqueio) —</option>' +
        '<option value="__novo__">＋ Cadastrar novo paciente…</option>' +
        PACS.filter(p => p.status !== 'inativo').map(p => `<option value="${p.id}">${p.nome}</option>`).join('');
      document.getElementById('fPaciente').addEventListener('change', e => {
        const v = e.target.value;
        document.getElementById('fTituloWrap').style.display = v ? 'none' : '';
        document.getElementById('fNovoPacWrap').style.display = v === '__novo__' ? '' : 'none';
        if (v === '__novo__') {
          // paciente novo → primeira ocorrência criada junto
          document.getElementById('fTratWrap').style.display = 'none';
          document.getElementById('fNovoTratWrap').style.display = '';
          fTipo.value = 'Avaliação inicial';
        } else {
          document.getElementById('fNovoTratWrap').style.display = 'none';
          montarTratSelect(v);
        }
      });
      document.getElementById('fTrat').addEventListener('change', e => {
        document.getElementById('fNovoTratWrap').style.display = e.target.value === '__novo__' ? '' : 'none';
      });
      document.getElementById('fTituloWrap').style.display = '';
      renderChips();
      await carregarMes();
      // vindo do prontuário: ?p=paciente&t=tratamento abre o modal pré-preenchido
      const q = new URLSearchParams(location.search);
      if (q.get('p') && PACS.some(p => p.id === q.get('p'))) {
        abrirNova();
        fPaciente.value = q.get('p');
        document.getElementById('fTituloWrap').style.display = 'none';
        montarTratSelect(q.get('p'), q.get('t'));
        const pac = PACS.find(p => p.id === q.get('p'));
        if (pac && pac.fisio_id) fFisio.value = pac.fisio_id;
      }
    }

    function montarTratSelect(pacienteId, preferId) {
      const wrap = document.getElementById('fTratWrap');
      const selEl = document.getElementById('fTrat');
      const novoWrap = document.getElementById('fNovoTratWrap');
      if (!pacienteId) { wrap.style.display = 'none'; novoWrap.style.display = 'none'; selEl.innerHTML = ''; return; }
      const doPac = TRATS_ALL.filter(t => t.paciente_id === pacienteId);
      wrap.style.display = '';
      selEl.innerHTML = '<option value="">— Sem vínculo (avaliação livre) —</option>' +
        doPac.map(t => `<option value="${t.id}">${t.titulo}${t.status === 'concluido' ? ' (concluído)' : ''}</option>`).join('') +
        '<option value="__novo__">＋ Nova ocorrência…</option>';
      const ativos = doPac.filter(t => t.status === 'ativo');
      if (preferId && doPac.some(t => t.id === preferId)) selEl.value = preferId;
      else if (ativos.length) selEl.value = ativos[ativos.length - 1].id;
      else if (!doPac.length) selEl.value = '__novo__';
      novoWrap.style.display = selEl.value === '__novo__' ? '' : 'none';
    }

    function renderChips() {
      const el = document.getElementById('fisioChips');
      el.innerHTML = `<button class="chip active" data-f="todos">Todos</button>` +
        FISIOS.filter(f=>f.ativo).map(f => `<button class="chip" data-f="${f.id}"><span class="dot" style="background:${f.cor};"></span>${f.nome.split(' ')[0]}</button>`).join('');
      el.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
        el.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
        c.classList.add('active');
        filtro = c.dataset.f;
        render();
      }));
      const vc = document.getElementById('vistaChips');
      vc.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
        vc.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
        c.classList.add('active');
        vista = c.dataset.v;
        if (vista !== 'mes' && diaSel === 1 && !EVENTOS.length) { const d = new Date(); if (d.getFullYear() === ano && d.getMonth() === mes) diaSel = d.getDate(); }
        carregarMes().catch(e => App.toast(e.message, 'error'));
      }));
    }

    async function carregarMes() { // carrega o período da vista atual
      let from, to;
      if (vista === 'mes') { from = iso(1); to = iso(new Date(ano, mes + 1, 0).getDate()); }
      else if (vista === 'semana') { const [i, f] = semanaDe(ancora()); from = isoData(i); to = isoData(f); }
      else { from = to = isoData(ancora()); }
      EVENTOS = await PF.get('sessoes', { from, to });
      atualizarLabel();
      render();
    }

    function atualizarLabel() {
      const el = document.getElementById('calMonth');
      if (vista === 'mes') el.textContent = `${MESES[mes]} ${ano}`;
      else if (vista === 'semana') {
        const [i, f] = semanaDe(ancora());
        el.textContent = `${i.getDate()} ${MESES[i.getMonth()].slice(0,3)} – ${f.getDate()} ${MESES[f.getMonth()].slice(0,3)} ${f.getFullYear()}`;
      } else {
        const d = ancora();
        el.textContent = `${['dom','seg','ter','qua','qui','sex','sáb'][d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`;
      }
    }

    function render() {
      const grid = document.getElementById('calGrid');
      grid.className = vista === 'mes' ? 'cal-grid' : 'tg-wrap';
      if (vista === 'mes') renderCal(); else renderGrade();
      renderDay();
    }

    function mudarPeriodo(dir) {
      if (vista === 'mes') {
        mes += dir;
        if (mes < 0) { mes = 11; ano--; }
        if (mes > 11) { mes = 0; ano++; }
        diaSel = 1;
      } else {
        const d = ancora();
        d.setDate(d.getDate() + dir * (vista === 'semana' ? 7 : 1));
        ano = d.getFullYear(); mes = d.getMonth(); diaSel = d.getDate();
      }
      carregarMes().catch(e => App.toast(e.message, 'error'));
    }

    function irHoje() {
      const d = new Date();
      ano = d.getFullYear(); mes = d.getMonth(); diaSel = d.getDate();
      carregarMes().catch(e => App.toast(e.message, 'error'));
    }

    function evsDoISO(dISO) {
      return EVENTOS.filter(e => e.data.slice(0,10) === dISO && (filtro === 'todos' || e.fisio_id === filtro) && e.status !== 'cancelada');
    }
    const evsDo = d => evsDoISO(iso(d));

    function selDia(dISO) {
      const [y, m, d] = dISO.split('-').map(Number);
      ano = y; mes = m - 1; diaSel = d;
      renderDay();
    }

    function clicarSlot(ev, dISO, h) {
      if (!ev.target.classList.contains('tg-cell')) return;
      selDia(dISO);
      abrirNova(dISO, `${String(h).padStart(2, '0')}:00`);
    }

    function clicarDia(ev, d) {
      diaSel = d; renderDay();
      // clique no espaço vazio da célula abre o modal já com a data
      if (ev.target.classList.contains('cal-cell') || ev.target.classList.contains('c-day')) abrirNova(iso(d));
    }

    function renderGrade() {
      const dias = vista === 'semana'
        ? (() => { const [i] = semanaDe(ancora()); return [...Array(7)].map((_, k) => { const d = new Date(i); d.setDate(i.getDate() + k); return d; }); })()
        : [ancora()];
      let html = `<div class="tg" style="grid-template-columns:56px repeat(${dias.length},1fr);">`;
      html += `<div class="tg-corner"></div>` + dias.map(d => {
        const dISO = isoData(d);
        return `<div class="tg-head${dISO === hojeISO ? ' today' : ''}" onclick="selDia('${dISO}')">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()]} <b>${d.getDate()}</b></div>`;
      }).join('');
      for (let h = 7; h <= 20; h++) {
        html += `<div class="tg-hora">${String(h).padStart(2,'0')}:00</div>`;
        for (const d of dias) {
          const dISO = isoData(d);
          const evs = evsDoISO(dISO).filter(e => Number(e.hora.slice(0,2)) === h).sort((a,b) => a.hora.localeCompare(b.hora));
          html += `<div class="tg-cell" onclick="clicarSlot(event,'${dISO}',${h})" title="Clique para agendar às ${String(h).padStart(2,'0')}:00">` +
            evs.map(e => `<span class="cal-ev" onclick="event.stopPropagation();selDia('${dISO}');abrirEvento('${e.id}')" style="background:${(fisioById(e.fisio_id)||{cor:'#94A8A5'}).cor};${e.status==='falta'?'opacity:.5;text-decoration:line-through;':''}">${e.hora.slice(0,5)} ${nomeEv(e)}</span>`).join('') +
          `</div>`;
        }
      }
      html += '</div>';
      document.getElementById('calGrid').innerHTML = html;
    }

    function renderCal() {
      const grid = document.getElementById('calGrid');
      const dows = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
      let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');
      const firstDow = new Date(ano, mes, 1).getDay();
      const ultimo = new Date(ano, mes + 1, 0).getDate();
      const prevUltimo = new Date(ano, mes, 0).getDate();
      for (let i = firstDow - 1; i >= 0; i--) html += `<div class="cal-cell other"><div class="c-day">${prevUltimo - i}</div></div>`;
      for (let d = 1; d <= ultimo; d++) {
        const evs = evsDo(d).sort((a,b) => a.hora.localeCompare(b.hora));
        const shown = evs.slice(0, 3);
        const extra = evs.length - shown.length;
        const isHoje = iso(d) === hojeISO;
        html += `<div class="cal-cell${isHoje ? ' today' : ''}" onclick="clicarDia(event, ${d})" style="cursor:pointer;" title="Clique no espaço vazio para agendar">
          <div class="c-day">${d}</div>
          ${shown.map(e => `<span class="cal-ev" onclick="event.stopPropagation();selDay(${d});abrirEvento('${e.id}')" style="background:${(fisioById(e.fisio_id)||{cor:'#94A8A5'}).cor};${e.status==='falta'?'opacity:.5;text-decoration:line-through;':''}">${e.hora.slice(0,5)} ${nomeEv(e)}</span>`).join('')}
          ${extra > 0 ? `<span class="cal-more">+${extra} sessões</span>` : ''}
        </div>`;
      }
      const total = firstDow + ultimo;
      const rest = Math.ceil(total / 7) * 7 - total;
      for (let d = 1; d <= rest; d++) html += `<div class="cal-cell other"><div class="c-day">${d}</div></div>`;
      grid.innerHTML = html;
    }

    function selDay(d) { diaSel = d; renderDay(); }

    function renderDay() {
      const dows = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
      const dw = dows[new Date(ano, mes, diaSel).getDay()];
      document.getElementById('dayTitle').textContent = `${dw.charAt(0).toUpperCase() + dw.slice(1)}, ${diaSel} de ${MESES[mes]}`;
      const evs = evsDo(diaSel).sort((a,b) => a.hora.localeCompare(b.hora));
      const list = document.getElementById('dayList');
      if (!evs.length) { list.innerHTML = `<div class="empty">Nenhuma sessão neste dia.</div>`; return; }
      list.innerHTML = evs.map(e => {
        const f = fisioById(e.fisio_id);
        const t = e.tratamento_id ? tratById(e.tratamento_id) : null;
        const pac = pacById(e.paciente_id);
        let credBadge = '';
        if (pac && pac.sessoes_total > 0) {
          const saldo = pac.sessoes_total - pac.sessoes_feitas;
          credBadge = saldo > 0
            ? `<span class="badge primary" title="${pac.pacote_nome || 'Pacote'}: ${pac.sessoes_feitas}/${pac.sessoes_total} usadas">🎫 ${saldo} crédito(s)</span>`
            : `<span class="badge red" title="Pacote esgotado — renovar no financeiro">🎫 sem créditos</span>`;
        } else if (pac) {
          credBadge = `<span class="badge gray" title="Paciente sem pacote — sessão avulsa">sem pacote</span>`;
        }
        const badge = e.status === 'realizada' ? '<span class="badge green">✓ realizada</span>'
          : e.status === 'falta' ? '<span class="badge red">falta</span>' : credBadge;
        const linkPront = e.paciente_id
          ? `<a href="prontuarios.html?p=${e.paciente_id}${e.tratamento_id ? '&t=' + e.tratamento_id : ''}" style="color:var(--primary);font-weight:600;font-size:.74rem;">📋 ${e.status === 'realizada' ? 'registrar evolução' : 'prontuário'} →</a>`
          : '';
        return `<div class="dl-item">
          <div class="dl-time">${e.hora.slice(0,5)}</div>
          <div class="dl-bar" style="background:${f ? f.cor : '#94A8A5'};"></div>
          <div style="flex:1;">
            <div class="dl-title" style="cursor:pointer;" onclick="abrirEvento('${e.id}')" title="Ver detalhes">${nomeEv(e)} ${badge}</div>
            <div class="dl-sub">${e.tipo}${t ? ' · 🩺 ' + t.titulo : ''}${f ? ' · ' + f.nome : ''}${e.obs ? ' · ' + e.obs : ''}</div>
            ${e.status === 'agendada' ? `<div style="display:flex;gap:6px;margin-top:7px;align-items:center;">
              <button class="btn btn-soft btn-sm" onclick="mudarStatus('${e.id}','realizada')">✓ Realizada</button>
              <button class="btn btn-ghost btn-sm" onclick="mudarStatus('${e.id}','falta')">Falta</button>
              <button class="btn btn-ghost btn-sm" onclick="excluir('${e.id}')" title="Excluir">🗑</button>
              ${linkPront}
            </div>` : `<div style="margin-top:5px;">${linkPront}</div>`}
          </div>
        </div>`;
      }).join('');
    }

    function abrirNova(data, hora) {
      document.getElementById('fData').value = data || iso(diaSel);
      if (hora) fHora.value = hora;
      ['npNome', 'npTel', 'ntTitulo'].forEach(id => document.getElementById(id).value = '');
      npConv.value = 'Particular'; ntRegiao.value = 'outro';
      document.getElementById('fNovoPacWrap').style.display = 'none';
      document.getElementById('fNovoTratWrap').style.display = fPaciente.value === '__novo__' ? '' : 'none';
      App.openModal('mSessao');
    }

    async function salvarSessao() {
      const btn = document.getElementById('btnSalvarSessao');
      if (!fData.value || !fHora.value || !fFisio.value) { App.toast('Preencha data, horário e fisioterapeuta', 'error'); return; }
      if (fPaciente.value === '__novo__' && !npNome.value.trim()) { App.toast('Informe o nome do novo paciente', 'error'); return; }
      btn.disabled = true;
      try {
        /* 1) cria o paciente, se for novo */
        let pacienteId = fPaciente.value === '__novo__' ? null : (fPaciente.value || null);
        if (fPaciente.value === '__novo__') {
          const novoPac = await PF.post('pacientes', {
            nome: npNome.value.trim(), telefone: npTel.value.trim() || null, convenio: npConv.value,
            fisio_id: fFisio.value, status: 'avaliacao',
          });
          pacienteId = novoPac.id;
          PACS = await PF.get('pacientes');
        }
        /* 2) cria a ocorrência, se for nova */
        let tratId = pacienteId ? (fPaciente.value === '__novo__' ? '__novo__' : (fTrat.value || null)) : null;
        if (tratId === '__novo__') {
          const novoTrat = await PF.post('tratamentos', {
            paciente_id: pacienteId,
            titulo: ntTitulo.value.trim() || 'Avaliação inicial',
            regiao: ntRegiao.value, fisio_id: fFisio.value, status: 'ativo',
          });
          tratId = novoTrat.id;
          TRATS_ALL = await PF.get('tratamentos');
        }
        const base = {
          paciente_id: pacienteId,
          tratamento_id: tratId,
          titulo: pacienteId ? null : (fTitulo.value.trim() || null),
          fisio_id: fFisio.value, tipo: fTipo.value,
          data: fData.value, hora: fHora.value, duracao: fDuracao.value,
          obs: fObs.value.trim() || null,
        };
        const rep = Number(fRepetir.value);
        const datas = [base.data];
        if (rep > 0) {
          const passos = rep === 1 ? [7,14,21,28] : rep === 2 ? [3,7,10,14,17,21,24,28] : [2,4,7,9,11,14,16,18,21,23,25,28];
          const d0 = new Date(base.data + 'T12:00:00');
          passos.forEach(p => { const d = new Date(d0); d.setDate(d0.getDate() + p); datas.push(d.toISOString().slice(0,10)); });
        }
        for (const data of datas) await PF.post('sessoes', { ...base, data });
        App.closeModal('mSessao');
        App.toast(datas.length > 1 ? `${datas.length} sessões agendadas!` : 'Sessão agendada!');
        if (fPaciente.value === '__novo__') {
          // reconstrói o select com o paciente recém-criado selecionado
          fPaciente.innerHTML = '<option value="">— Sem paciente (turma/bloqueio) —</option>' +
            '<option value="__novo__">＋ Cadastrar novo paciente…</option>' +
            PACS.filter(p => p.status !== 'inativo').map(p => `<option value="${p.id}">${p.nome}</option>`).join('');
          fPaciente.value = pacienteId;
          document.getElementById('fNovoPacWrap').style.display = 'none';
          document.getElementById('fNovoTratWrap').style.display = 'none';
          montarTratSelect(pacienteId, tratId);
        }
        await carregarMes();
      } catch (e) { App.toast(e.message, 'error'); }
      btn.disabled = false;
    }

    /* ---------- Detalhes do evento ---------- */
    function abrirEvento(id) {
      const e = EVENTOS.find(x => x.id === id);
      if (!e) return;
      const f = fisioById(e.fisio_id);
      const pac = pacById(e.paciente_id);
      const t = e.tratamento_id ? tratById(e.tratamento_id) : null;
      const ST = {
        agendada: '<span class="badge blue">Agendada</span>', realizada: '<span class="badge green">✓ Realizada</span>',
        falta: '<span class="badge red">Falta</span>', cancelada: '<span class="badge gray">Cancelada</span>',
      };
      let cred = '';
      if (pac && pac.sessoes_total > 0) {
        const saldo = pac.sessoes_total - pac.sessoes_feitas;
        cred = saldo > 0 ? `<span class="badge primary">🎫 ${saldo} crédito(s) — ${pac.pacote_nome}</span>` : '<span class="badge red">🎫 sem créditos</span>';
      }
      document.getElementById('evmTitulo').textContent = nomeEv(e);
      const linha = (l, v) => v ? `<div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #EDF1F0;font-size:.87rem;">
        <span style="min-width:110px;color:var(--text-soft);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.5px;padding-top:2px;">${l}</span><span style="flex:1;">${v}</span></div>` : '';
      document.getElementById('evmBody').innerHTML =
        linha('Status', `${ST[e.status] || e.status} ${cred}`) +
        linha('Quando', `${PF.fmtData(e.data.slice(0,10))} às ${e.hora.slice(0,5)} · ${e.duracao || ''}`) +
        linha('Tipo', e.tipo) +
        linha('Paciente', pac ? pac.nome : null) +
        linha('Ocorrência', t ? `🩺 ${t.titulo}${t.status === 'concluido' ? ' (concluída)' : ''}` : (pac ? '<span style="color:var(--text-soft);">sem vínculo</span>' : null)) +
        linha('Fisioterapeuta', f ? f.nome : null) +
        linha('Observações', e.obs);
      const foot = [];
      if (e.status === 'agendada') {
        foot.push(`<button class="btn btn-soft" onclick="App.closeModal('mEvento');mudarStatus('${e.id}','realizada')">✓ Realizada</button>`);
        foot.push(`<button class="btn btn-ghost" onclick="App.closeModal('mEvento');mudarStatus('${e.id}','falta')">Falta</button>`);
      }
      foot.push(`<button class="btn btn-danger" onclick="App.closeModal('mEvento');excluir('${e.id}')">🗑 Excluir</button>`);
      if (pac) foot.push(`<button class="btn btn-primary" style="margin-left:auto;" onclick="location.href='prontuarios.html?p=${e.paciente_id}${e.tratamento_id ? '&t=' + e.tratamento_id : ''}&s=${e.id}'">📋 Registrar evolução no prontuário</button>`);
      document.getElementById('evmFoot').innerHTML = foot.join('');
      App.openModal('mEvento');
    }

    async function mudarStatus(id, status) {
      try {
        const r = await PF.api(`/api/sessoes/${id}/status`, { method: 'PATCH', body: { status } });
        const c = r.creditos;
        if (status === 'realizada' && c && c.total > 0) {
          if (c.saldo >= 0) App.toast(`Sessão paga com crédito do pacote 🎫 — saldo: ${c.saldo} de ${c.total}`);
          if (c.saldo <= 0) setTimeout(() => App.toast(
            c.saldo < 0 ? 'Paciente está além do pacote — cobre avulsa ou renove no Financeiro' : 'Pacote chegou ao fim — proponha a renovação no Financeiro', 'info'), 700);
        } else {
          App.toast(status === 'realizada' ? 'Sessão realizada (sem pacote — considere cobrança avulsa)' : 'Falta registrada');
        }
        PACS = await PF.get('pacientes'); // atualiza saldos nos badges
        await carregarMes();
      } catch (e) { App.toast(e.message, 'error'); }
    }

    async function excluir(id) {
      if (!confirm('Excluir esta sessão?')) return;
      try { await PF.del('sessoes', id); App.toast('Sessão excluída'); await carregarMes(); }
      catch (e) { App.toast(e.message, 'error'); }
    }

    boot().catch(e => App.toast(e.message, 'error'));
  </script>
</body>
</html>
