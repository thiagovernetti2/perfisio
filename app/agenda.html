<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda — PerFisio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-page="agenda" data-title="Agenda" data-subtitle="Sessões, avaliações e turmas da clínica">

  <div class="cal-toolbar">
    <div class="cal-nav">
      <button onclick="mudarMes(-1)">‹</button>
      <button onclick="mudarMes(1)">›</button>
    </div>
    <div class="cal-month" id="calMonth"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;" id="fisioChips"></div>
    <div style="flex:1;"></div>
    <button class="btn btn-primary" onclick="abrirNova()">+ Nova sessão</button>
  </div>

  <div class="grid-2">
    <div class="cal-grid" id="calGrid"></div>

    <div class="card">
      <div class="card-header"><h3 id="dayTitle">—</h3></div>
      <div class="card-pad day-list" id="dayList"><div class="empty">Carregando...</div></div>
    </div>
  </div>

  <!-- MODAL NOVA SESSÃO -->
  <div class="modal-overlay" id="mSessao">
    <div class="modal">
      <div class="modal-head">
        <h3>Nova sessão</h3>
        <button class="close" onclick="App.closeModal('mSessao')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field full"><label>Paciente (ou deixe vazio p/ turma)</label>
            <select id="fPaciente"></select>
          </div>
          <div class="field full" id="fTratWrap" style="display:none;"><label>Ocorrência / tratamento</label>
            <select id="fTrat"></select>
          </div>
          <div class="field full" id="fTituloWrap" style="display:none;"><label>Título (turma / bloqueio)</label><input type="text" id="fTitulo" placeholder="Ex.: Pilates — turma das 15h"></div>
          <div class="field"><label>Fisioterapeuta</label><select id="fFisio"></select></div>
          <div class="field"><label>Tipo</label>
            <select id="fTipo"><option>Sessão de tratamento</option><option>Avaliação inicial</option><option>Reavaliação</option><option>Pilates (turma)</option><option>Domiciliar</option></select>
          </div>
          <div class="field"><label>Data</label><input type="date" id="fData"></div>
          <div class="field"><label>Horário</label><input type="time" id="fHora" value="09:00"></div>
          <div class="field"><label>Duração</label>
            <select id="fDuracao"><option>50 min</option><option>30 min</option><option>1h</option></select>
          </div>
          <div class="field"><label>Repetir (próximas 4 semanas)</label>
            <select id="fRepetir"><option value="0">Não repete</option><option value="1">Semanal</option><option value="2">2x por semana</option><option value="3">3x por semana</option></select>
          </div>
          <div class="field full"><label>Observações</label><textarea id="fObs" placeholder="Ex.: focar em mobilidade de quadril"></textarea></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="App.closeModal('mSessao')">Cancelar</button>
        <button class="btn btn-primary" id="btnSalvarSessao" onclick="salvarSessao()">Agendar sessão</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script>
    const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    let ano, mes; // mes: 0-11
    { const d = new Date(); ano = d.getFullYear(); mes = d.getMonth(); }
    let filtro = 'todos', diaSel = new Date().getDate();
    let FISIOS = [], PACS = [], EVENTOS = [];
    const hojeISO = PF.hojeISO();

    const iso = d => `${ano}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const fisioById = id => FISIOS.find(f => f.id === id);
    const pacById = id => PACS.find(p => p.id === id);
    const nomeEv = e => { const p = pacById(e.paciente_id); return p ? p.nome : (e.titulo || e.tipo); };

    let TRATS_ALL = [];
    const tratById = id => TRATS_ALL.find(t => t.id === id);

    async function boot() {
      [FISIOS, PACS, TRATS_ALL] = await Promise.all([PF.get('fisios'), PF.get('pacientes'), PF.get('tratamentos')]);
      document.getElementById('fFisio').innerHTML = FISIOS.filter(f=>f.ativo).map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
      document.getElementById('fPaciente').innerHTML = '<option value="">— Sem paciente (turma/bloqueio) —</option>' +
        PACS.filter(p => p.status !== 'inativo').map(p => `<option value="${p.id}">${p.nome}</option>`).join('');
      document.getElementById('fPaciente').addEventListener('change', e => {
        document.getElementById('fTituloWrap').style.display = e.target.value ? 'none' : '';
        montarTratSelect(e.target.value);
      });
      document.getElementById('fTituloWrap').style.display = '';
      renderChips();
      await carregarMes();
      // vindo do prontuário: ?p=paciente&t=tratamento abre o modal pré-preenchido
      const q = new URLSearchParams(location.search);
      if (q.get('p') && PACS.some(p => p.id === q.get('p'))) {
        abrirNova();
        fPaciente.value = q.get('p');
        document.getElementById('fTituloWrap').style.display = 'none';
        montarTratSelect(q.get('p'), q.get('t'));
        const pac = PACS.find(p => p.id === q.get('p'));
        if (pac && pac.fisio_id) fFisio.value = pac.fisio_id;
      }
    }

    function montarTratSelect(pacienteId, preferId) {
      const wrap = document.getElementById('fTratWrap');
      const selEl = document.getElementById('fTrat');
      if (!pacienteId) { wrap.style.display = 'none'; selEl.innerHTML = ''; return; }
      const doPac = TRATS_ALL.filter(t => t.paciente_id === pacienteId);
      wrap.style.display = '';
      selEl.innerHTML = '<option value="">— Sem vínculo (avaliação livre) —</option>' +
        doPac.map(t => `<option value="${t.id}">${t.titulo}${t.status === 'concluido' ? ' (concluído)' : ''}</option>`).join('');
      const ativos = doPac.filter(t => t.status === 'ativo');
      if (preferId && doPac.some(t => t.id === preferId)) selEl.value = preferId;
      else if (ativos.length) selEl.value = ativos[ativos.length - 1].id;
    }

    function renderChips() {
      const el = document.getElementById('fisioChips');
      el.innerHTML = `<button class="chip active" data-f="todos">Todos</button>` +
        FISIOS.filter(f=>f.ativo).map(f => `<button class="chip" data-f="${f.id}"><span class="dot" style="background:${f.cor};"></span>${f.nome.split(' ')[0]}</button>`).join('');
      el.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
        el.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
        c.classList.add('active');
        filtro = c.dataset.f;
        renderCal(); renderDay();
      }));
    }

    async function carregarMes() {
      const ultimo = new Date(ano, mes + 1, 0).getDate();
      EVENTOS = await PF.get('sessoes', { from: iso(1), to: iso(ultimo) });
      document.getElementById('calMonth').textContent = `${MESES[mes]} ${ano}`;
      renderCal(); renderDay();
    }

    function mudarMes(dir) {
      mes += dir;
      if (mes < 0) { mes = 11; ano--; }
      if (mes > 11) { mes = 0; ano++; }
      diaSel = 1;
      carregarMes().catch(e => App.toast(e.message, 'error'));
    }

    function evsDo(d) {
      return EVENTOS.filter(e => Number(e.data.slice(8,10)) === d && (filtro === 'todos' || e.fisio_id === filtro) && e.status !== 'cancelada');
    }

    function renderCal() {
      const grid = document.getElementById('calGrid');
      const dows = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
      let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');
      const firstDow = new Date(ano, mes, 1).getDay();
      const ultimo = new Date(ano, mes + 1, 0).getDate();
      const prevUltimo = new Date(ano, mes, 0).getDate();
      for (let i = firstDow - 1; i >= 0; i--) html += `<div class="cal-cell other"><div class="c-day">${prevUltimo - i}</div></div>`;
      for (let d = 1; d <= ultimo; d++) {
        const evs = evsDo(d).sort((a,b) => a.hora.localeCompare(b.hora));
        const shown = evs.slice(0, 3);
        const extra = evs.length - shown.length;
        const isHoje = iso(d) === hojeISO;
        html += `<div class="cal-cell${isHoje ? ' today' : ''}" onclick="selDay(${d})" style="cursor:pointer;">
          <div class="c-day">${d}</div>
          ${shown.map(e => `<span class="cal-ev" style="background:${(fisioById(e.fisio_id)||{cor:'#94A8A5'}).cor};${e.status==='falta'?'opacity:.5;text-decoration:line-through;':''}">${e.hora.slice(0,5)} ${nomeEv(e)}</span>`).join('')}
          ${extra > 0 ? `<span class="cal-more">+${extra} sessões</span>` : ''}
        </div>`;
      }
      const total = firstDow + ultimo;
      const rest = Math.ceil(total / 7) * 7 - total;
      for (let d = 1; d <= rest; d++) html += `<div class="cal-cell other"><div class="c-day">${d}</div></div>`;
      grid.innerHTML = html;
    }

    function selDay(d) { diaSel = d; renderDay(); }

    function renderDay() {
      const dows = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
      const dw = dows[new Date(ano, mes, diaSel).getDay()];
      document.getElementById('dayTitle').textContent = `${dw.charAt(0).toUpperCase() + dw.slice(1)}, ${diaSel} de ${MESES[mes]}`;
      const evs = evsDo(diaSel).sort((a,b) => a.hora.localeCompare(b.hora));
      const list = document.getElementById('dayList');
      if (!evs.length) { list.innerHTML = `<div class="empty">Nenhuma sessão neste dia.</div>`; return; }
      list.innerHTML = evs.map(e => {
        const f = fisioById(e.fisio_id);
        const t = e.tratamento_id ? tratById(e.tratamento_id) : null;
        const pac = pacById(e.paciente_id);
        let credBadge = '';
        if (pac && pac.sessoes_total > 0) {
          const saldo = pac.sessoes_total - pac.sessoes_feitas;
          credBadge = saldo > 0
            ? `<span class="badge primary" title="${pac.pacote_nome || 'Pacote'}: ${pac.sessoes_feitas}/${pac.sessoes_total} usadas">🎫 ${saldo} crédito(s)</span>`
            : `<span class="badge red" title="Pacote esgotado — renovar no financeiro">🎫 sem créditos</span>`;
        } else if (pac) {
          credBadge = `<span class="badge gray" title="Paciente sem pacote — sessão avulsa">sem pacote</span>`;
        }
        const badge = e.status === 'realizada' ? '<span class="badge green">✓ realizada</span>'
          : e.status === 'falta' ? '<span class="badge red">falta</span>' : credBadge;
        const linkPront = e.paciente_id
          ? `<a href="prontuarios.html?p=${e.paciente_id}${e.tratamento_id ? '&t=' + e.tratamento_id : ''}" style="color:var(--primary);font-weight:600;font-size:.74rem;">📋 ${e.status === 'realizada' ? 'registrar evolução' : 'prontuário'} →</a>`
          : '';
        return `<div class="dl-item">
          <div class="dl-time">${e.hora.slice(0,5)}</div>
          <div class="dl-bar" style="background:${f ? f.cor : '#94A8A5'};"></div>
          <div style="flex:1;">
            <div class="dl-title">${nomeEv(e)} ${badge}</div>
            <div class="dl-sub">${e.tipo}${t ? ' · 🩺 ' + t.titulo : ''}${f ? ' · ' + f.nome : ''}${e.obs ? ' · ' + e.obs : ''}</div>
            ${e.status === 'agendada' ? `<div style="display:flex;gap:6px;margin-top:7px;align-items:center;">
              <button class="btn btn-soft btn-sm" onclick="mudarStatus('${e.id}','realizada')">✓ Realizada</button>
              <button class="btn btn-ghost btn-sm" onclick="mudarStatus('${e.id}','falta')">Falta</button>
              <button class="btn btn-ghost btn-sm" onclick="excluir('${e.id}')" title="Excluir">🗑</button>
              ${linkPront}
            </div>` : `<div style="margin-top:5px;">${linkPront}</div>`}
          </div>
        </div>`;
      }).join('');
    }

    function abrirNova() {
      document.getElementById('fData').value = iso(diaSel);
      App.openModal('mSessao');
    }

    async function salvarSessao() {
      const btn = document.getElementById('btnSalvarSessao');
      const base = {
        paciente_id: fPaciente.value || null,
        tratamento_id: fPaciente.value ? (fTrat.value || null) : null,
        titulo: fPaciente.value ? null : (fTitulo.value.trim() || null),
        fisio_id: fFisio.value, tipo: fTipo.value,
        data: fData.value, hora: fHora.value, duracao: fDuracao.value,
        obs: fObs.value.trim() || null,
      };
      if (!base.data || !base.hora || !base.fisio_id) { App.toast('Preencha data, horário e fisioterapeuta', 'error'); return; }
      btn.disabled = true;
      try {
        const rep = Number(fRepetir.value);
        const datas = [base.data];
        if (rep > 0) {
          const passos = rep === 1 ? [7,14,21,28] : rep === 2 ? [3,7,10,14,17,21,24,28] : [2,4,7,9,11,14,16,18,21,23,25,28];
          const d0 = new Date(base.data + 'T12:00:00');
          passos.forEach(p => { const d = new Date(d0); d.setDate(d0.getDate() + p); datas.push(d.toISOString().slice(0,10)); });
        }
        for (const data of datas) await PF.post('sessoes', { ...base, data });
        App.closeModal('mSessao');
        App.toast(datas.length > 1 ? `${datas.length} sessões agendadas!` : 'Sessão agendada!');
        await carregarMes();
      } catch (e) { App.toast(e.message, 'error'); }
      btn.disabled = false;
    }

    async function mudarStatus(id, status) {
      try {
        const r = await PF.api(`/api/sessoes/${id}/status`, { method: 'PATCH', body: { status } });
        const c = r.creditos;
        if (status === 'realizada' && c && c.total > 0) {
          if (c.saldo >= 0) App.toast(`Sessão paga com crédito do pacote 🎫 — saldo: ${c.saldo} de ${c.total}`);
          if (c.saldo <= 0) setTimeout(() => App.toast(
            c.saldo < 0 ? 'Paciente está além do pacote — cobre avulsa ou renove no Financeiro' : 'Pacote chegou ao fim — proponha a renovação no Financeiro', 'info'), 700);
        } else {
          App.toast(status === 'realizada' ? 'Sessão realizada (sem pacote — considere cobrança avulsa)' : 'Falta registrada');
        }
        PACS = await PF.get('pacientes'); // atualiza saldos nos badges
        await carregarMes();
      } catch (e) { App.toast(e.message, 'error'); }
    }

    async function excluir(id) {
      if (!confirm('Excluir esta sessão?')) return;
      try { await PF.del('sessoes', id); App.toast('Sessão excluída'); await carregarMes(); }
      catch (e) { App.toast(e.message, 'error'); }
    }

    boot().catch(e => App.toast(e.message, 'error'));
  </script>
</body>
</html>
