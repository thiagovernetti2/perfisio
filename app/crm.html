<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM · Captação — PerFisio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-page="crm" data-title="CRM · Captação de pacientes" data-subtitle="Arraste os cards entre as etapas do funil">

  <div class="page-head">
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <span class="badge primary">18 leads no funil</span>
      <span class="badge green">Taxa de conversão: 46%</span>
      <span class="badge amber">6 sem resposta há 3+ dias</span>
    </div>
    <button class="btn btn-primary" onclick="App.openModal('mLead')">+ Novo lead</button>
  </div>

  <div class="kanban" id="kanban"></div>

  <!-- MODAL NOVO LEAD -->
  <div class="modal-overlay" id="mLead">
    <div class="modal">
      <div class="modal-head">
        <h3>Novo lead</h3>
        <button class="close" onclick="App.closeModal('mLead')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field"><label>Nome</label><input type="text" placeholder="Nome do contato"></div>
          <div class="field"><label>Telefone / WhatsApp</label><input type="text" placeholder="(11) 9 0000-0000"></div>
          <div class="field"><label>Origem</label>
            <select><option>Site PerFisio</option><option>Instagram</option><option>Google</option><option>Indicação médica</option><option>Indicação de paciente</option><option>Convênio</option></select>
          </div>
          <div class="field"><label>Interesse</label>
            <select><option>Fisioterapia ortopédica</option><option>Fisioterapia esportiva</option><option>Pilates clínico</option><option>RPG</option><option>Neurofuncional</option><option>Domiciliar</option></select>
          </div>
          <div class="field full"><label>Queixa / observação</label><textarea placeholder="Ex.: dor no joelho ao correr, quer avaliação essa semana"></textarea></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="App.closeModal('mLead')">Cancelar</button>
        <button class="btn btn-primary" onclick="App.closeModal('mLead'); App.toast('Lead adicionado ao funil!')">Adicionar lead</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script>
    const COLS = [
      { id: 'novo',      title: 'Novo contato',        cor: '#2D7DD2' },
      { id: 'contato',   title: 'Contato feito',       cor: '#7C5CBF' },
      { id: 'avaliacao', title: 'Avaliação agendada',  cor: '#D9820B' },
      { id: 'proposta',  title: 'Plano proposto',      cor: '#0DA189' },
      { id: 'convertido',title: 'Paciente convertido', cor: '#1E9E6A' },
    ];
    let LEADS = [
      { id: 1, nome: 'Renata Campos', origem: 'Site PerFisio', interesse: 'Cervicalgia + cefaleia', valor: 1400, fisio: 'camila', dias: 2, col: 'avaliacao' },
      { id: 2, nome: 'Tiago Prado', origem: 'Indicação médica', interesse: 'Dor no ombro', valor: 1200, fisio: 'camila', dias: 1, col: 'avaliacao' },
      { id: 3, nome: 'Luciana Freitas', origem: 'Instagram', interesse: 'Pilates clínico', valor: 680, fisio: 'marina', dias: 0, col: 'novo' },
      { id: 4, nome: 'Roberto Cunha', origem: 'Google', interesse: 'Lombalgia', valor: 1400, fisio: 'camila', dias: 3, col: 'novo' },
      { id: 5, nome: 'Amanda Silveira', origem: 'Site PerFisio', interesse: 'Pós-op. ombro', valor: 2200, fisio: 'rafael', dias: 1, col: 'contato' },
      { id: 6, nome: 'Felipe Araújo', origem: 'Indicação de paciente', interesse: 'Fisio esportiva · corrida', valor: 1600, fisio: 'rafael', dias: 4, col: 'contato' },
      { id: 7, nome: 'Dona Ilda Martins', origem: 'Convênio', interesse: 'Pós-AVC · domiciliar', valor: 3600, fisio: 'pedro', dias: 2, col: 'proposta' },
      { id: 8, nome: 'Carlos Eduardo', origem: 'Google', interesse: 'Hérnia de disco', valor: 1800, fisio: 'camila', dias: 6, col: 'proposta' },
      { id: 9, nome: 'Juliana Prates', origem: 'Instagram', interesse: 'RPG · escoliose', valor: 960, fisio: 'marina', dias: 0, col: 'convertido' },
      { id: 10, nome: 'Otávio Bernardes', origem: 'Site PerFisio', interesse: 'Entorse de tornozelo', valor: 880, fisio: 'rafael', dias: 1, col: 'convertido' },
      { id: 11, nome: 'Vanessa Rocha', origem: 'Site PerFisio', interesse: 'Pilates clínico', valor: 680, fisio: 'marina', dias: 5, col: 'novo' },
      { id: 12, nome: 'Gilberto Nunes', origem: 'Indicação médica', interesse: 'Parkinson · equilíbrio', valor: 3600, fisio: 'pedro', dias: 2, col: 'contato' },
    ];
    const ORIGEM_ICO = { 'Site PerFisio': '🌐', 'Instagram': '📸', 'Google': '🔎', 'Indicação médica': '🩺', 'Indicação de paciente': '🤝', 'Convênio': '🏥' };

    function render() {
      document.getElementById('kanban').innerHTML = COLS.map(col => {
        const cards = LEADS.filter(l => l.col === col.id);
        const sum = cards.reduce((a, l) => a + l.valor, 0);
        return `<div class="kb-col" data-col="${col.id}">
          <div class="kb-col-head">
            <span class="kb-dot" style="background:${col.cor};"></span>
            <span class="kb-title">${col.title}</span>
            <span class="kb-count">${cards.length}</span>
            <span class="kb-sum">${App.moneyShort(sum)}</span>
          </div>
          <div class="kb-cards">
            ${cards.map(l => {
              const f = App.fisio(l.fisio);
              return `<div class="kb-card" draggable="true" data-id="${l.id}">
                <div class="kc-name">${l.nome}</div>
                <div class="kc-prop">${ORIGEM_ICO[l.origem] || '•'} ${l.origem} · ${l.interesse}</div>
                <div class="kc-foot">
                  <span class="kc-value">${App.money(l.valor)}</span>
                  <div class="kc-meta">
                    <span class="kc-days">${l.dias === 0 ? 'hoje' : l.dias + 'd'}</span>
                    <span class="avatar-sm" style="background:${f.cor};width:24px;height:24px;font-size:.6rem;" title="${f.nome}">${App.iniciais(f.nome)}</span>
                  </div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('');
      bindDnD();
    }

    function bindDnD() {
      let dragged = null;
      document.querySelectorAll('.kb-card').forEach(card => {
        card.addEventListener('dragstart', () => { dragged = card; card.classList.add('dragging'); });
        card.addEventListener('dragend', () => { card.classList.remove('dragging'); dragged = null; });
      });
      document.querySelectorAll('.kb-col').forEach(col => {
        col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
        col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
        col.addEventListener('drop', e => {
          e.preventDefault();
          col.classList.remove('drag-over');
          if (!dragged) return;
          const lead = LEADS.find(l => l.id == dragged.dataset.id);
          const dest = col.dataset.col;
          if (lead && lead.col !== dest) {
            lead.col = dest;
            render();
            const colTitle = COLS.find(c => c.id === dest).title;
            App.toast(`${lead.nome} movido para "${colTitle}"`);
            if (dest === 'convertido') setTimeout(() => App.toast('Lembre de cadastrar o paciente e agendar a 1ª sessão', 'info'), 600);
          }
        });
      });
    }

    render();
  </script>
</body>
</html>
