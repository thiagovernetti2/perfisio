<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prontuários — PerFisio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-page="prontuarios" data-title="Prontuários" data-subtitle="Prontuário eletrônico com evoluções, avaliações e prescrições">

  <div class="grid-2" style="grid-template-columns:300px 1fr;">
    <!-- LISTA DE PACIENTES -->
    <div class="card">
      <div class="card-pad" style="padding-bottom:12px;">
        <div style="display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 12px;">
          🔍 <input id="patSearch" type="text" placeholder="Buscar paciente..." style="border:none;background:none;outline:none;width:100%;font-size:.85rem;">
        </div>
      </div>
      <div class="pat-list" id="patList"><div class="empty">Carregando...</div></div>
    </div>

    <!-- PRONTUÁRIO -->
    <div id="prontuario" style="display:none;">
      <div class="card card-pad" style="margin-bottom:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
        <span class="avatar-sm" id="pHeadAvatar" style="width:52px;height:52px;font-size:1rem;background:#0DA189;"></span>
        <div style="flex:1;min-width:200px;">
          <div id="pHeadNome" style="font-size:1.1rem;font-weight:800;color:var(--ink);"></div>
          <div id="pHeadSub" style="font-size:.8rem;color:var(--text-soft);margin-top:2px;"></div>
        </div>
        <div style="display:flex;gap:8px;">
          <span class="badge green" id="pHeadStatus"></span>
          <button class="btn btn-ghost btn-sm" onclick="window.print()">🖨 Imprimir</button>
        </div>
      </div>

      <div class="tabs" id="pTabs" data-auto>
        <button class="tab active" data-tab="evolucoes">Evoluções</button>
        <button class="tab" data-tab="avaliacao">Avaliação inicial</button>
        <button class="tab" data-tab="prescricoes">Exercícios prescritos</button>
      </div>

      <!-- EVOLUÇÕES -->
      <div data-tab-panel="evolucoes">
        <div class="card card-pad" style="margin-bottom:18px;">
          <h3 style="font-size:.95rem;margin-bottom:12px;">Nova evolução (SOAP)</h3>
          <div class="form-grid">
            <div class="field"><label>S — Subjetivo</label><textarea id="evS" placeholder="Relato do paciente..."></textarea></div>
            <div class="field"><label>O — Objetivo</label><textarea id="evO" placeholder="Achados do fisioterapeuta..."></textarea></div>
            <div class="field"><label>A — Avaliação</label><textarea id="evA" placeholder="Análise da evolução..."></textarea></div>
            <div class="field"><label>P — Plano</label><textarea id="evP" placeholder="Conduta para as próximas sessões..."></textarea></div>
            <div class="field"><label>EVA (dor 0–10)</label><input type="number" id="evEva" min="0" max="10" placeholder="Ex.: 4"></div>
            <div class="field"><label>Fisioterapeuta</label><select id="evFisio"></select></div>
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:14px;">
            <button class="btn btn-primary" id="btnEv" onclick="salvarEvolucao()">Salvar evolução</button>
          </div>
        </div>
        <div id="soapList"></div>
      </div>

      <!-- AVALIAÇÃO -->
      <div data-tab-panel="avaliacao" style="display:none;">
        <div class="card card-pad">
          <h3 style="font-size:.95rem;margin-bottom:14px;">Avaliação inicial</h3>
          <div class="form-grid">
            <div class="field full"><label>Queixa principal e história</label><textarea id="avHistoria" style="min-height:90px;" placeholder="Queixa, início dos sintomas, exames, histórico..."></textarea></div>
            <div class="field full"><label>Exame físico</label><textarea id="avExame" style="min-height:90px;" placeholder="ADM, força, testes especiais, postura..."></textarea></div>
            <div class="field full"><label>Diagnóstico cinético-funcional</label><textarea id="avDiag" placeholder="Ex.: lombalgia mecânica crônica com déficit de estabilização..."></textarea></div>
            <div class="field full"><label>Plano de tratamento e metas</label><textarea id="avPlano" style="min-height:90px;" placeholder="Fases, frequência, metas objetivas (EVA, ADM, retorno ao esporte)..."></textarea></div>
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:14px;">
            <button class="btn btn-primary" onclick="salvarAvaliacao()">Salvar avaliação</button>
          </div>
        </div>
      </div>

      <!-- PRESCRIÇÕES -->
      <div data-tab-panel="prescricoes" style="display:none;">
        <div class="card">
          <div class="card-header">
            <h3>Prescrições de exercícios</h3>
            <a class="link" href="exercicios.html">Prescrever na biblioteca →</a>
          </div>
          <div class="card-pad" id="presList"></div>
        </div>
      </div>
    </div>

    <div id="vazio" class="card card-pad" style="display:none;">
      <div class="empty">Nenhum paciente cadastrado ainda.<br><br>
        <a class="btn btn-primary" href="pacientes.html">+ Cadastrar primeiro paciente</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script>
    let PACS = [], FISIOS = [], sel = null;
    const CORES = ['#0DA189','#2D7DD2','#7C5CBF','#D9820B','#D64545','#1E9E6A'];
    const STATUS_TXT = { tratamento: 'Em tratamento', avaliacao: 'Em avaliação', alta: 'Alta', inativo: 'Inativo' };

    async function boot() {
      [PACS, FISIOS] = await Promise.all([PF.get('pacientes'), PF.get('fisios')]);
      document.getElementById('evFisio').innerHTML = FISIOS.filter(f=>f.ativo).map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
      if (!PACS.length) {
        document.getElementById('vazio').style.display = '';
        document.getElementById('patList').innerHTML = '<div class="empty">Sem pacientes</div>';
        return;
      }
      const urlP = new URLSearchParams(location.search).get('p');
      renderList();
      selPac(PACS.find(p => p.id === urlP)?.id || PACS[0].id);
    }

    function renderList(q = '') {
      document.getElementById('patList').innerHTML = PACS
        .filter(p => p.nome.toLowerCase().includes(q.toLowerCase()))
        .map((p, i) => `
          <div class="pat-item${p.id === sel ? ' active' : ''}" onclick="selPac('${p.id}')">
            <span class="avatar-sm" style="background:${CORES[i % 6]};">${App.iniciais(p.nome)}</span>
            <div><div class="pt-name">${p.nome}</div><div class="pt-sub">${p.queixa || STATUS_TXT[p.status]}${p.sessoes_total ? ' · ' + p.sessoes_feitas + '/' + p.sessoes_total : ''}</div></div>
          </div>`).join('') || '<div class="empty">Nenhum paciente encontrado.</div>';
    }

    async function selPac(id) {
      sel = id;
      const p = PACS.find(x => x.id === id);
      if (!p) return;
      document.getElementById('prontuario').style.display = '';
      const f = FISIOS.find(x => x.id === p.fisio_id);
      const idade = PF.idade(p.nascimento);
      document.getElementById('pHeadNome').textContent = p.nome;
      document.getElementById('pHeadSub').textContent =
        [idade ? idade + ' anos' : null, p.convenio || 'Particular', p.queixa, f ? f.nome : null].filter(Boolean).join(' · ');
      document.getElementById('pHeadStatus').textContent = STATUS_TXT[p.status] + (p.sessoes_total ? ` · ${p.sessoes_feitas}/${p.sessoes_total}` : '');
      const av = document.getElementById('pHeadAvatar');
      av.textContent = App.iniciais(p.nome);
      av.style.background = CORES[PACS.indexOf(p) % 6];
      if (p.fisio_id) document.getElementById('evFisio').value = p.fisio_id;
      // avaliação
      const a = p.avaliacao || {};
      avHistoria.value = a.historia || ''; avExame.value = a.exame || '';
      avDiag.value = a.diagnostico || ''; avPlano.value = a.plano || '';
      renderList(document.getElementById('patSearch').value);
      await Promise.all([carregarEvolucoes(), carregarPrescricoes()]);
    }

    async function carregarEvolucoes() {
      const evs = await PF.get('evolucoes', { paciente_id: sel });
      document.getElementById('soapList').innerHTML = evs.map(e => {
        const f = FISIOS.find(x => x.id === e.fisio_id);
        return `<div class="soap-block">
          <div class="sp-head">
            <span class="sp-date">${PF.fmtData(e.data.slice(0,10))}${f ? ' · ' + f.nome : ''}</span>
            <span>${e.eva != null ? `<span class="badge ${e.eva <= 3 ? 'green' : e.eva <= 6 ? 'amber' : 'red'}">EVA ${e.eva}</span>` : ''}
            <button style="background:none;border:none;color:var(--text-soft);font-size:.8rem;" title="Excluir" onclick="excluirEv('${e.id}')">✕</button></span>
          </div>
          ${e.s ? `<div class="sp-row"><b>S</b> ${e.s}</div>` : ''}
          ${e.o ? `<div class="sp-row"><b>O</b> ${e.o}</div>` : ''}
          ${e.a ? `<div class="sp-row"><b>A</b> ${e.a}</div>` : ''}
          ${e.p ? `<div class="sp-row"><b>P</b> ${e.p}</div>` : ''}
        </div>`;
      }).join('') || '<div class="empty">Nenhuma evolução registrada ainda.</div>';
    }

    async function carregarPrescricoes() {
      const prs = await PF.get('prescricoes', { paciente_id: sel });
      document.getElementById('presList').innerHTML = prs.map(pr => `
        <div class="soap-block">
          <div class="sp-head"><span class="sp-date">${PF.fmtData(pr.criado_em.slice(0,10))} · ${pr.freq || ''} ${pr.duracao ? '· ' + pr.duracao : ''}</span></div>
          ${(pr.itens || []).map(i => `<div class="sp-row">💪 <b style="text-transform:none;letter-spacing:0;">${i.nome}</b> ${i.reps || ''}</div>`).join('')}
        </div>`).join('') || '<div class="empty">Nenhuma prescrição. Monte uma na <a href="exercicios.html" style="color:var(--primary);font-weight:600;">biblioteca de exercícios</a>.</div>';
    }

    async function salvarEvolucao() {
      const body = {
        paciente_id: sel, fisio_id: evFisio.value || null,
        s: evS.value.trim() || null, o: evO.value.trim() || null,
        a: evA.value.trim() || null, p: evP.value.trim() || null,
        eva: evEva.value === '' ? null : Number(evEva.value),
        data: PF.hojeISO(),
      };
      if (!body.s && !body.o && !body.a && !body.p) { App.toast('Preencha ao menos um campo da evolução', 'error'); return; }
      const btn = document.getElementById('btnEv'); btn.disabled = true;
      try {
        await PF.post('evolucoes', body);
        ['evS','evO','evA','evP','evEva'].forEach(id => document.getElementById(id).value = '');
        App.toast('Evolução registrada no prontuário!');
        await carregarEvolucoes();
      } catch (e) { App.toast(e.message, 'error'); }
      btn.disabled = false;
    }

    async function excluirEv(id) {
      if (!confirm('Excluir esta evolução?')) return;
      try { await PF.del('evolucoes', id); await carregarEvolucoes(); App.toast('Evolução excluída'); }
      catch (e) { App.toast(e.message, 'error'); }
    }

    async function salvarAvaliacao() {
      try {
        const avaliacao = { historia: avHistoria.value.trim(), exame: avExame.value.trim(), diagnostico: avDiag.value.trim(), plano: avPlano.value.trim() };
        await PF.put('pacientes', sel, { avaliacao });
        const p = PACS.find(x => x.id === sel); if (p) p.avaliacao = avaliacao;
        App.toast('Avaliação salva no prontuário!');
      } catch (e) { App.toast(e.message, 'error'); }
    }

    document.getElementById('patSearch').addEventListener('input', e => renderList(e.target.value));
    boot().catch(e => App.toast(e.message, 'error'));
  </script>
</body>
</html>
