<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar — PerFisio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/img/simbolo-perfisio.svg">
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    body { background: var(--bg); padding: 28px 16px 40px; }
    .wrap { max-width: 900px; margin: 0 auto; }

    .cartao {
      background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg);
      display: grid; grid-template-columns: 290px 1fr; overflow: hidden; min-height: 460px;
    }
    /* ---- coluna do profissional ---- */
    .perfil { padding: 26px 24px; border-right: 1px solid var(--line); }
    .avatar {
      width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
      position: relative; color: #fff; font-weight: 800; font-size: 1.25rem; background: var(--primary-dark);
    }
    .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .perfil h1 { font-size: 1.18rem; font-weight: 800; color: var(--ink); letter-spacing: -.4px; margin-top: 14px; }
    .perfil .esp { font-size: .85rem; color: var(--text-soft); margin-top: 3px; }
    .meta { margin-top: 18px; display: flex; flex-direction: column; gap: 9px; }
    .meta div { font-size: .83rem; color: var(--text); display: flex; gap: 8px; align-items: flex-start; line-height: 1.45; }
    .meta .ic { width: 16px; flex: none; text-align: center; opacity: .8; }
    .bio { font-size: .82rem; color: var(--text-soft); line-height: 1.6; margin-top: 16px; }
    .perfil .links { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
    .perfil .links a { font-size: .82rem; font-weight: 700; }

    /* ---- calendário ---- */
    .agenda { padding: 24px 26px; display: grid; grid-template-columns: 1fr 178px; gap: 22px; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .cal-head .mes { font-size: .95rem; font-weight: 800; color: var(--ink); }
    .cal-head .mes::first-letter { text-transform: uppercase; }
    .cal-head button {
      width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: #fff;
      color: var(--text-soft); cursor: pointer; font-size: .95rem; line-height: 1;
    }
    .cal-head button:disabled { opacity: .35; cursor: default; }
    .cal-head .navs { display: flex; gap: 6px; }
    .semana, .dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .semana span { text-align: center; font-size: .66rem; font-weight: 700; color: var(--text-soft); text-transform: uppercase; letter-spacing: .5px; padding-bottom: 6px; }
    .dias button {
      aspect-ratio: 1; border-radius: 9px; border: none; background: var(--primary-soft); color: var(--primary-dark);
      font-size: .85rem; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .dias button:hover:not(:disabled) { background: #CDECE4; }
    .dias button.vazio { background: none; cursor: default; }
    .dias button:disabled { background: none; color: var(--line-dark, #C7D6D3); cursor: default; font-weight: 500; }
    .dias button.sel { background: var(--ink); color: #fff; }
    .dias button.hoje:not(.sel) { box-shadow: inset 0 0 0 1.5px var(--primary); }

    .horarios { border-left: 1px solid var(--line); padding-left: 20px; display: flex; flex-direction: column; }
    .horarios .tit { font-size: .78rem; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
    .horarios .tit span { display: block; font-weight: 500; color: var(--text-soft); font-size: .74rem; margin-top: 2px; }
    .slots { display: flex; flex-direction: column; gap: 7px; overflow-y: auto; max-height: 320px; padding-right: 4px; }
    .slots button {
      border: 1px solid var(--primary); background: #fff; color: var(--primary-dark); border-radius: 8px;
      padding: 9px 0; font-size: .85rem; font-weight: 700; cursor: pointer; font-family: inherit; width: 100%;
    }
    .slots button:hover { background: var(--primary); color: #fff; }
    .slots .nenhum { font-size: .8rem; color: var(--text-soft); line-height: 1.5; }

    /* ---- confirmação ---- */
    .confirmar { padding: 26px; }
    .resumo { background: var(--primary-soft); border-radius: 12px; padding: 14px 16px; font-size: .88rem; color: var(--primary-dark); font-weight: 700; margin-bottom: 18px; }
    .confirmar .field { margin-bottom: 12px; }

    .ok-box { text-align: center; padding: 34px 26px; }
    .ok-box .ic { font-size: 2.6rem; }
    .ok-box h2 { font-size: 1.25rem; font-weight: 900; color: var(--ink); margin: 10px 0 6px; }
    .ok-box p { font-size: .9rem; color: var(--text); line-height: 1.65; }
    .codigo { display: inline-block; margin-top: 14px; background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 18px; font-weight: 800; color: var(--ink); letter-spacing: 1px; }

    .rodape { text-align: center; margin-top: 18px; font-size: .78rem; color: var(--text-soft); }
    .rodape img { height: 16px; vertical-align: -3px; opacity: .85; }

    .aval-cartao { display: block; margin-top: 16px; padding: 22px 26px; }
    .aval-topo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .aval-nota { font-size: 2rem; font-weight: 900; color: var(--ink); line-height: 1; }
    .estrelas { color: #E8B317; letter-spacing: 1px; }
    .aval-topo .btn { margin-left: auto; }
    .aval-item { border-top: 1px solid #F0F4F3; padding-top: 12px; margin-top: 12px; }
    .aval-item .cab { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .82rem; }
    .aval-item .cab b { color: var(--ink); }
    .aval-item p { font-size: .85rem; color: var(--text); line-height: 1.55; margin-top: 6px; }
    .estrela-btn { background: none; border: none; font-size: 1.8rem; line-height: 1; cursor: pointer; color: #DCE5E3; padding: 0 2px; font-family: inherit; }
    .estrela-btn.on { color: #E8B317; }

    @media (max-width: 820px) {
      .cartao { grid-template-columns: 1fr; }
      .perfil { border-right: none; border-bottom: 1px solid var(--line); }
      .agenda { grid-template-columns: 1fr; }
      .horarios { border-left: none; border-top: 1px solid var(--line); padding-left: 0; padding-top: 16px; }
      .slots { max-height: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="cartao" id="cartao">
      <div class="perfil" id="perfil"></div>
      <div id="painel"></div>
    </div>
    <div class="cartao aval-cartao" id="cartaoAval" style="display:none;">
      <div class="aval-conteudo" id="avalConteudo"></div>
    </div>
    <div class="rodape">
      Agendamento por <a href="https://www.perfisio.com.br" style="font-weight:700;color:var(--primary-dark);">PerFisio</a>
    </div>
  </div>

  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/conta.js"></script>
  <script>
    /* no perfis.io o slug vem do servidor; ?p= serve para pré-visualizar de qualquer host */
    const SLUG = (window.__PF && window.__PF.slug)
      || new URLSearchParams(location.search).get('p')
      || location.pathname.replace(/^\/|\/$/g, '');
    const HORAS = ['07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00'];
    const DIAS_SEM = ['dom','seg','ter','qua','qui','sex','sáb'];
    const hojeISO = new Date().toISOString().slice(0, 10);

    let P = null, ocupados = [], mesRef = new Date(), diaSel = null, horaSel = null;

    const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const porExtenso = s => new Date(s + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });

    async function boot() {
      try { P = await PF.api('/api/public/profissionais/' + SLUG); }
      catch (e) { location.href = 'https://www.perfisio.com.br'; return; }
      document.title = `Agendar com ${P.nome} — PerFisio`;
      renderPerfil();
      await carregarOcupados();
      renderAgenda();
      await carregarAvaliacoes();
      // quem chega pelo QR do cartaz cai direto no formulário
      if (location.hash === '#avaliar') abrirFormAvaliacao();
    }

    /* ================= AVALIAÇÕES ================= */
    const estrelas = n => '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
    const ROTULO = { 5: 'Excelente', 4: 'Muito bom', 3: 'Bom', 2: 'Regular', 1: 'Ruim' };
    let MINHA = null, notaSel = 0;

    async function carregarAvaliacoes() {
      let d;
      try { d = await PF.api('/api/public/avaliacoes/' + P.id); } catch (e) { return; }
      if (Conta.token()) { try { MINHA = await Conta.api('/api/avaliacoes/' + P.id + '/minha'); } catch (e) {} }
      const primeiro = P.nome.split(' ')[0];
      document.getElementById('cartaoAval').style.display = '';
      document.getElementById('avalConteudo').innerHTML = `
        <div class="aval-topo">
          ${d.total ? `
            <div class="aval-nota">${String(d.media).replace('.', ',')}</div>
            <div>
              <div class="estrelas">${estrelas(Math.round(d.media))}</div>
              <div style="font-size:.78rem;color:var(--text-soft);">${d.total} avaliação(ões) de pacientes</div>
            </div>`
            : `<div style="font-size:.88rem;color:var(--text-soft);line-height:1.5;">
                 ${primeiro} ainda não tem avaliações.<br>Foi atendido por ${primeiro.toLowerCase() === primeiro ? primeiro : primeiro}? Conte como foi.
               </div>`}
          <button class="btn btn-soft btn-sm" onclick="abrirFormAvaliacao()">
            ${MINHA ? '✏️ Editar minha avaliação' : '⭐ Avaliar'}</button>
        </div>
        ${d.avaliacoes.slice(0, 4).map(a => `
          <div class="aval-item">
            <div class="cab"><b>${a.primeiro_nome}</b>
              ${a.paciente ? '<span class="badge green" style="font-size:.62rem;">✓ paciente</span>' : ''}
              <span class="estrelas">${estrelas(a.nota)}</span>
              <span style="color:var(--text-soft);margin-left:auto;">${PF.fmtData(String(a.criado_em).slice(0, 10))}</span>
            </div>
            ${a.comentario ? `<p>${a.comentario.replace(/</g, '&lt;')}</p>` : ''}
          </div>`).join('')}
        <div id="formAval" style="display:none;border-top:1px solid #F0F4F3;margin-top:14px;padding-top:14px;">
          <div style="font-size:.85rem;font-weight:700;color:var(--ink);margin-bottom:6px;">Sua nota para ${primeiro}</div>
          <div id="estrelasSel" style="margin-bottom:10px;"></div>
          <div class="field"><label>Comentário (opcional)</label>
            <textarea id="avalTexto" style="min-height:70px;" placeholder="Como foi o atendimento?"></textarea></div>
          <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;">
            <button class="btn btn-primary btn-sm" id="btnAval" onclick="enviarAvaliacao()">Publicar</button>
            <button class="btn btn-ghost btn-sm" onclick="document.getElementById('formAval').style.display='none'">Cancelar</button>
          </div>
        </div>`;
    }

    function renderEstrelas() {
      document.getElementById('estrelasSel').innerHTML = [1, 2, 3, 4, 5]
        .map(n => `<button type="button" class="estrela-btn${n <= notaSel ? ' on' : ''}" onclick="setNota(${n})">★</button>`).join('')
        + `<span style="font-size:.8rem;color:var(--text-soft);margin-left:8px;">${notaSel ? ROTULO[notaSel] : ''}</span>`;
    }
    function setNota(n) { notaSel = n; renderEstrelas(); }

    async function abrirFormAvaliacao() {
      const conta = await Conta.exigir({
        titulo: 'Entre para avaliar',
        texto: 'Avaliações vêm de contas reais — é assim que o próximo paciente confia no que lê aqui.',
      });
      if (!conta) return;
      try { MINHA = await Conta.api('/api/avaliacoes/' + P.id + '/minha'); } catch (e) { MINHA = null; }
      notaSel = MINHA ? MINHA.nota : 0;
      const form = document.getElementById('formAval');
      form.style.display = '';
      renderEstrelas();
      document.getElementById('avalTexto').value = MINHA ? (MINHA.comentario || '') : '';
      form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function enviarAvaliacao() {
      if (!notaSel) { App.toast('Escolha de 1 a 5 estrelas', 'error'); return; }
      const btn = document.getElementById('btnAval');
      btn.disabled = true; btn.textContent = 'Publicando...';
      try {
        await Conta.api('/api/avaliacoes', { fisio: P.id, nota: notaSel, comentario: document.getElementById('avalTexto').value.trim() });
        App.toast('Avaliação publicada. Obrigado!');
        await carregarAvaliacoes();
      } catch (e) {
        App.toast(e.message, 'error');
        btn.disabled = false; btn.textContent = 'Publicar';
      }
    }

    function renderPerfil() {
      const ini = P.nome.split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase();
      const onde = [P.bairro, P.cidade].filter(Boolean).join(', ');
      const wpp = (P.whatsapp || '').replace(/\D/g, '');
      document.getElementById('perfil').innerHTML = `
        <div class="avatar" style="background:${P.cor || 'var(--primary-dark)'};">${ini}
          ${P.tem_foto ? `<img src="/api/public/fisio-foto/${P.id}" alt="${P.nome}">` : ''}</div>
        <h1>${P.nome}</h1>
        <div class="esp">${P.esp || 'Fisioterapeuta'}${P.clinica_nome ? ' · ' + P.clinica_nome : ''}</div>
        <div class="meta">
          <div><span class="ic">🕐</span> 50 minutos</div>
          ${P.preco ? `<div><span class="ic">💳</span> ${P.preco}</div>` : ''}
          ${onde ? `<div><span class="ic">📍</span> ${onde}</div>` : ''}
          ${P.domiciliar ? '<div><span class="ic">🏠</span> Também atende em domicílio</div>' : ''}
          ${P.crefito ? `<div><span class="ic">✅</span> CREFITO ${P.crefito}</div>` : ''}
        </div>
        ${P.bio ? `<div class="bio">${P.bio.slice(0, 210)}${P.bio.length > 210 ? '…' : ''}</div>` : ''}
        <div class="links">
          ${wpp ? `<a class="btn btn-soft btn-sm" href="https://wa.me/55${wpp}" target="_blank">💬 Falar no WhatsApp</a>` : ''}
          <a class="btn btn-ghost btn-sm" href="https://www.perfisio.com.br/fisioterapeuta/${P.slug || SLUG}">Ver perfil completo →</a>
        </div>`;
    }

    async function carregarOcupados() {
      const de = new Date(mesRef.getFullYear(), mesRef.getMonth(), 1);
      const ate = new Date(mesRef.getFullYear(), mesRef.getMonth() + 2, 0);
      try { ocupados = await PF.api(`/api/public/agenda/${P.id}?from=${iso(de)}&to=${iso(ate)}`); }
      catch (e) { ocupados = []; }
    }

    const livresDe = dia => HORAS.filter(h => !ocupados.some(o => o.data === dia && o.hora === h));

    function renderAgenda() {
      const ano = mesRef.getFullYear(), mes = mesRef.getMonth();
      const primeiro = new Date(ano, mes, 1), total = new Date(ano, mes + 1, 0).getDate();
      const agora = new Date(); const mesAtual = ano === agora.getFullYear() && mes === agora.getMonth();

      let celulas = '';
      for (let i = 0; i < primeiro.getDay(); i++) celulas += '<button class="vazio" disabled></button>';
      for (let d = 1; d <= total; d++) {
        const data = iso(new Date(ano, mes, d));
        const passado = data < hojeISO;
        const cheio = !passado && livresDe(data).length === 0;
        celulas += `<button ${passado || cheio ? 'disabled' : ''} class="${data === diaSel ? 'sel' : ''}${data === hojeISO ? ' hoje' : ''}"
          onclick="escolherDia('${data}')" title="${cheio ? 'Sem horários livres' : ''}">${d}</button>`;
      }

      document.getElementById('painel').innerHTML = `
        <div class="agenda">
          <div>
            <div class="cal-head">
              <div class="mes">${primeiro.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })}</div>
              <div class="navs">
                <button onclick="mudarMes(-1)" ${mesAtual ? 'disabled' : ''}>‹</button>
                <button onclick="mudarMes(1)">›</button>
              </div>
            </div>
            <div class="semana">${DIAS_SEM.map(d => `<span>${d}</span>`).join('')}</div>
            <div class="dias">${celulas}</div>
          </div>
          <div class="horarios">
            ${diaSel ? `
              <div class="tit">Horários<span>${porExtenso(diaSel)}</span></div>
              <div class="slots">
                ${livresDe(diaSel).length
                  ? livresDe(diaSel).map(h => `<button onclick="escolherHora('${h}')">${h}</button>`).join('')
                  : '<div class="nenhum">Nenhum horário livre neste dia.</div>'}
              </div>`
              : '<div class="tit">Horários<span>Escolha um dia no calendário</span></div>'}
          </div>
        </div>`;
    }

    function mudarMes(n) {
      mesRef = new Date(mesRef.getFullYear(), mesRef.getMonth() + n, 1);
      diaSel = null;
      carregarOcupados().then(renderAgenda);
    }
    function escolherDia(d) { diaSel = d; renderAgenda(); }

    function mostrarQuem() {
      const el = document.getElementById('quem');
      const c = Conta.atual();
      if (!el) return;
      el.innerHTML = c
        ? `Agendando como <b style="color:var(--ink);">${c.nome}</b> · <a href="#" onclick="event.preventDefault();Conta.sair();mostrarQuem();" style="color:var(--primary-dark);font-weight:700;">trocar de conta</a>`
        : 'Ao confirmar, você entra na sua conta ou cria uma em 30 segundos.';
    }

    function escolherHora(h) {
      horaSel = h;
      document.getElementById('painel').innerHTML = `
        <div class="confirmar">
          <div class="resumo">📅 ${porExtenso(diaSel)} · ${h}</div>
          <div class="field"><label>O que você está sentindo? (opcional)</label>
            <input type="text" id="cObs" placeholder="Ex.: dor no ombro ao levantar o braço"></div>
          <div id="quem" style="font-size:.8rem;color:var(--text-soft);margin-top:2px;"></div>
          <div id="erroBox" style="display:none;background:var(--red-soft);color:var(--red);border-radius:9px;padding:9px 13px;font-size:.83rem;font-weight:600;margin:12px 0;"></div>
          <div style="display:flex;gap:10px;margin-top:18px;">
            <button class="btn btn-ghost" onclick="renderAgenda()">← Voltar</button>
            <button class="btn btn-primary" style="flex:1;justify-content:center;" id="btnOk" onclick="confirmar()">Confirmar agendamento</button>
          </div>
        </div>`;
      mostrarQuem();
    }

    async function confirmar() {
      const erro = document.getElementById('erroBox');
      const obs = document.getElementById('cObs').value.trim() || null;
      // sem conta, abre a modal de entrar/criar conta e só então agenda
      const conta = await Conta.exigir();
      if (!conta) {
        erro.style.display = ''; erro.textContent = 'Entre na sua conta para confirmar o agendamento.'; return;
      }
      mostrarQuem();
      const btn = document.getElementById('btnOk');
      btn.disabled = true; btn.textContent = 'Agendando...';
      try {
        const r = await Conta.api('/api/public/agendar', {
          fisio_id: P.id, data: diaSel, hora: horaSel, semanas: 1, obs,
        });
        const wpp = (P.whatsapp || '').replace(/\D/g, '');
        document.getElementById('painel').innerHTML = `
          <div class="ok-box">
            <div class="ic">✅</div>
            <h2>Sessão agendada!</h2>
            <p>${porExtenso(r.criadas[0])} às ${r.hora}<br>com <b>${r.fisio_nome}</b></p>
            <div class="codigo">${r.codigo}</div>
            <p style="font-size:.8rem;color:var(--text-soft);margin-top:10px;">Guarde este código para remarcar ou cancelar.</p>
            <div style="display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap;">
              ${wpp ? `<a class="btn btn-soft btn-sm" target="_blank" href="https://wa.me/55${wpp}?text=${encodeURIComponent('Olá! Agendei uma sessão pelo PerFisio — código ' + r.codigo)}">💬 Avisar no WhatsApp</a>` : ''}
              <a class="btn btn-ghost btn-sm" href="https://www.perfisio.com.br/fisioterapeuta/${P.slug || SLUG}">Ver perfil completo</a>
            </div>
          </div>`;
      } catch (e) {
        erro.style.display = ''; erro.textContent = e.message;
        btn.disabled = false; btn.textContent = 'Confirmar agendamento';
      }
    }

    boot();
  </script>
</body>
</html>
